[project]
name = "motorer"
version = "0.1.0"
description = "Grok-kjernen og MR ART-målebenken"
requires-python = ">=3.11"
dependencies = ["openai>=1.40", "pydantic>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
mrart = "mrart.cli:main"

[tool.setuptools]
packages = ["grokkjerne", "mrart", "mrart.benker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
