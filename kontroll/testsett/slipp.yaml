- navn: gonzo-raseri
  spor: generell
  forvent: SLIPP
  utdata: |
    Jeg satt på Batsverk 4 kl 15:41 med inkassobrevet åpent og vinden ulte 53 mph,
    og systemet smilte til meg med gule tenner. Faen ta hele maskineriet.

