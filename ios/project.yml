# Alternativ til den sjekket-inn prosjektfilen: `brew install xcodegen && cd ios && xcodegen`
name: Antipsykologen
options:
  bundleIdPrefix: no.antipsykologen
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: nb
configFiles:
  Debug: Support/Debug.xcconfig
  Release: Support/Release.xcconfig
targets:
  Antipsykologen:
    type: application
    platform: iOS
    sources: [Antipsykologen]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.antipsykologen.app
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Antipsykologen
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
  AntipsykologenTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AntipsykologenTests]
    dependencies:
      - target: Antipsykologen
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  Antipsykologen:
    build:
      targets:
        Antipsykologen: all
        AntipsykologenTests: [test]
    test:
      targets: [AntipsykologenTests]
