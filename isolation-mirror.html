<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isolation Mirror</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --bg:#1a1f1c; --card:#2a332c; --text:#e0ebe3; --muted:#8a9a8f; --accent:#a8c5b0; }
  body { font-family:system-ui; background:var(--bg); color:var(--text); margin:0; padding:20px; max-width:480px; margin:0 auto; }
  h1 { font-size:1.4rem; margin-bottom:8px; }
  p { color:var(--muted); font-size:0.9rem; }
  textarea, input[type=file] { width:100%; background:var(--card); border:1px solid #3a4a3f; border-radius:12px; padding:12px; color:var(--text); margin:12px 0; box-sizing:border-box; }
  button { width:100%; background:var(--accent); color:#1a1f1c; border:none; border-radius:12px; padding:14px; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid #3a4a3f; color:var(--text); margin-top:8px; }
  .output { display:none; margin-top:24px; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:16px; }
  .card h3 { margin:0 0 8px; font-size:1rem; }
  img.prev { width:100%; border-radius:12px; margin:8px 0; max-height:220px; object-fit:cover; display:none; }
  pre { white-space:pre-wrap; font-size:0.8rem; color:var(--text); }
  a.back { color:var(--muted); font-size:0.82rem; display:inline-block; margin-bottom:16px; }
</style>
</head>
<body>
  <a class="back" href="index.html">← Pusterom</a>
  <h1>Isolation Mirror</h1>
  <p>Note eller bilde. Alt lokalt. Bildet forlater ikke enheten. Prompten kan du lime i Labben eller Grok-bot.</p>
  <textarea id="note" rows="4" placeholder="Skriv kort om isolasjonen eller det som tynger..."></textarea>
  <input type="file" id="photo" accept="image/*">
  <img class="prev" id="prev" alt="">
  <button onclick="generate()">Generer</button>
  <div class="output" id="out">
    <div class="card">
      <h3>Privat protokoll (kun din)</h3>
      <div id="protocol"></div>
    </div>
    <div class="card">
      <h3>Labben / Grok-bot</h3>
      <p>Lim dette i Labben eller i Grok-bot med /lab.</p>
      <pre id="labprompt"></pre>
      <button class="ghost" onclick="copyPrompt()">Kopier prompt</button>
    </div>
  </div>
<script>
document.getElementById('photo').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  const img = document.getElementById('prev');
  if (!f) { img.style.display = 'none'; return; }
  img.src = URL.createObjectURL(f);
  img.style.display = 'block';
});
function generate() {
  const note = document.getElementById('note').value.trim() || "stille isolasjon";
  const hasPhoto = !!(document.getElementById('photo').files && document.getElementById('photo').files[0]);
  const steps = [
    "Sett føttene i gulvet. 3 dype pust.",
    "Skriv én setning som er sann akkurat nå.",
    hasPhoto ? "Bildet ligger bare her. Ikke del det. Se på det i 20 sekunder." : "Ta ett bilde av noe ekte i nærheten — ikke for andre, for deg."
  ];
  document.getElementById('protocol').innerHTML = steps.map((s,i)=>'<p>'+(i+1)+'. '+s+'</p>').join('') + '<p style="margin-top:12px;font-style:italic">Du er ikke alene i dette. Kampen teller.</p>';
  const prompt = 'Grok-bot runtime. /lab. Klasse M.\nPROBLEM: Isolasjon. ' + note.slice(0,180) + '\nBRUKER: én person, lokal, ingen sky\nRAMMER: 48t, lokal-first, ingen marketplace, ingen app+sky\nDNA: fototerapi + passiv mekanikk + 48t\nLEVERANSE: ideer\nSeed 7. Drepe minst 3. IRP på overlevende #1.\nSkriv IDE ≤3 setninger på nynorsk. Stopp.\nIkke nytt OS.';
  document.getElementById('labprompt').textContent = prompt;
  document.getElementById('out').style.display = 'block';
}
function copyPrompt() {
  navigator.clipboard.writeText(document.getElementById('labprompt').textContent);
}
</script>
</body>
</html>
