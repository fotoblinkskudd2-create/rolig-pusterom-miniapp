<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1f1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Isolation Mirror</title>
<style>
  :root { --bg:#1a1f1c; --card:#2a332c; --text:#e0ebe3; --muted:#9aaa9f; --accent:#a8c5b0; --line:#3a4a3f; }
  * { box-sizing:border-box; }
  body { font-family:system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); margin:0 auto; padding:calc(20px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom)); max-width:480px; line-height:1.5; }
  h1 { font-size:1.4rem; margin:0 0 8px; }
  p { color:var(--muted); font-size:0.9rem; margin:0 0 12px; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  textarea { width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; color:var(--text); margin:12px 0; font:inherit; resize:vertical; }
  .file { display:flex; gap:8px; align-items:center; margin:0 0 12px; }
  .file label { flex:1; background:var(--card); border:1px dashed var(--line); border-radius:12px; padding:12px; color:var(--muted); cursor:pointer; font-size:0.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file input { position:absolute; opacity:0; width:1px; height:1px; }
  .file input:focus-visible + label { outline:3px solid var(--accent); outline-offset:2px; }
  button { width:100%; background:var(--accent); color:#1a1f1c; border:none; border-radius:12px; padding:14px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); margin-top:8px; }
  button.small { width:auto; padding:10px 14px; font-weight:500; }
  .output { display:none; margin-top:24px; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:16px; }
  .card h2 { margin:0 0 8px; font-size:1rem; }
  .card ol { margin:0; padding-left:1.3em; }
  .card li { margin-bottom:8px; }
  .card .closing { margin-top:12px; font-style:italic; color:var(--text); }
  img.prev { width:100%; border-radius:12px; margin:0 0 12px; max-height:220px; object-fit:cover; display:none; }
  pre { white-space:pre-wrap; font-size:0.8rem; color:var(--text); background:var(--bg); border-radius:10px; padding:12px; margin:8px 0 0; overflow-wrap:anywhere; }
  a.back { color:var(--muted); font-size:0.85rem; display:inline-block; margin-bottom:16px; text-decoration:none; }
  .sr-only { position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .status { min-height:1.4em; text-align:center; font-size:0.85rem; color:var(--accent); margin-top:8px; }
</style>
</head>
<body>
  <a class="back" href="index.html">← Pusterom</a>
  <h1>Isolation Mirror</h1>
  <p>Note eller bilde. Alt lokalt. Bildet forlater ikke enheten. Prompten kan du lime i Labben eller Grok-bot.</p>
  <label for="note" class="sr-only">Note</label>
  <textarea id="note" rows="4" maxlength="2000" placeholder="Skriv kort om isolasjonen eller det som tynger..."></textarea>
  <div class="file">
    <input type="file" id="photo" accept="image/*">
    <label for="photo" id="photoLabel">📷 Velg bilde (valgfritt)</label>
    <button type="button" class="ghost small" id="clearPhoto" hidden>Fjern</button>
  </div>
  <img class="prev" id="prev" alt="Ditt bilde – vises bare her">
  <button type="button" id="generateBtn">Generer</button>
  <div class="output" id="out">
    <div class="card">
      <h2>Privat protokoll (kun din)</h2>
      <ol id="protocol"></ol>
      <p class="closing">Du er ikke alene i dette. Kampen teller.</p>
    </div>
    <div class="card">
      <h2>Labben / Grok-bot</h2>
      <p>Lim dette i Labben eller i Grok-bot med /lab.</p>
      <pre id="labprompt"></pre>
      <button type="button" class="ghost" id="copyBtn">Kopier prompt</button>
      <div class="status" id="copyStatus" role="status" aria-live="polite"></div>
    </div>
  </div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
let objectUrl = null;

function currentPhoto() {
  return ($('photo').files && $('photo').files[0]) || null;
}

function showPhoto() {
  const f = currentPhoto();
  const img = $('prev');
  if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
  if (!f) {
    img.style.display = 'none';
    img.removeAttribute('src');
    $('photoLabel').textContent = '📷 Velg bilde (valgfritt)';
    $('clearPhoto').hidden = true;
    return;
  }
  objectUrl = URL.createObjectURL(f);
  img.src = objectUrl;
  img.style.display = 'block';
  $('photoLabel').textContent = '📷 ' + f.name;
  $('clearPhoto').hidden = false;
}
$('photo').addEventListener('change', showPhoto);
$('clearPhoto').addEventListener('click', () => { $('photo').value = ''; showPhoto(); });

function generate() {
  const note = $('note').value.trim().replace(/\s+/g, ' ') || 'stille isolasjon';
  const hasPhoto = !!currentPhoto();
  const steps = [
    'Sett føttene i gulvet. 3 dype pust.',
    'Skriv én setning som er sann akkurat nå.',
    hasPhoto ? 'Bildet ligger bare her. Ikke del det. Se på det i 20 sekunder.' : 'Ta ett bilde av noe ekte i nærheten — ikke for andre, for deg.'
  ];
  const ol = $('protocol');
  ol.textContent = '';
  steps.forEach((s) => {
    const li = document.createElement('li');
    li.textContent = s;
    ol.appendChild(li);
  });
  const prompt = 'Grok-bot runtime. /lab. Klasse M.\nPROBLEM: Isolasjon. ' + note.slice(0, 180) + '\nBRUKER: én person, lokal, ingen sky\nRAMMER: 48t, lokal-first, ingen marketplace, ingen app+sky\nDNA: fototerapi + passiv mekanikk + 48t\nLEVERANSE: ideer\nSeed 7. Drepe minst 3. IRP på overlevende #1.\nSkriv IDE ≤3 setninger på nynorsk. Stopp.\nIkke nytt OS.';
  $('labprompt').textContent = prompt;
  $('copyStatus').textContent = '';
  $('out').style.display = 'block';
  $('out').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
$('generateBtn').addEventListener('click', generate);

// Reserve for nettlesere uten Clipboard API (f.eks. file:// i noen Safari-versjoner).
function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}

async function copyPrompt() {
  const text = $('labprompt').textContent;
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (e) {
    ok = legacyCopy(text);
  }
  if (!ok) {
    const range = document.createRange();
    range.selectNodeContents($('labprompt'));
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
  $('copyStatus').textContent = ok ? 'Kopiert. Lim inn i Labben.' : 'Markert – kopier manuelt.';
}
$('copyBtn').addEventListener('click', copyPrompt);
</script>
</body>
</html>
