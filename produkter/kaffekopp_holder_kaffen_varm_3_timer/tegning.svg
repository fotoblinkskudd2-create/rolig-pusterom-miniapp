<text x="690.0" y="829.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222">Produkt</text>
<text x="780.0" y="829.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">Kaffekopp «Tretimer» P1 – varm i 3 t uten strøm</text>
<text x="690.0" y="851.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222">Volum</text>
<text x="780.0" y="851.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">330 ml brutto, 300 ml kaffe</text>
<text x="690.0" y="873.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222">Mål</text>
<text x="780.0" y="873.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">Ø89 × 115 mm, ≈ 417 g [modell]</text>
<text x="690.0" y="895.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222">Materialer</text>
<text x="780.0" y="895.0" font-size="12" text-anchor="start" font-weight="normal" fill="#222">AISI 304, PCM (organisk, innkapslet), PP/silikon</text>
<text x="690.0" y="917.0" font-size="12" text-anchor="start" font-weight="bold" fill="#222">Krav</text>
