[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kunstfabrikk"
version = "0.1.0"
description = "Anti-slop pipeline: gonzo-stencil-serier, nyhets-satire, skill-kjeder, fokusplan og tekststruktur"
requires-python = ">=3.10"
dependencies = ["pillow>=10"]

[project.optional-dependencies]
claude = ["anthropic>=2.6"]
dev = ["pytest>=8"]

[project.scripts]
kunstfabrikk = "kunstfabrikk.__main__:main"

[tool.setuptools.packages.find]
include = ["kunstfabrikk*"]

[tool.setuptools.package-data]
kunstfabrikk = ["skills/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
