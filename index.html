<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pusterom – Rolig mini-app</title>
<meta name="description" content="Rolig mini-app for å dempe stress og nedstemthet.">
<meta name="theme-color" content="#a8c5b0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pusterom">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #f5f7f4;
    --card: #ffffff;
    --text: #3a4a3f;
    --muted: #7a8a7f;
    --accent: #a8c5b0;
    --soft-blue: #d4e4f0;
    --soft-beige: #f0e9df;
    --soft-green: #e0ebe3;
    --border: #e5ebe6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c211d;
      --card: #262e26;
      --text: #e3ece4;
      --muted: #94a696;
      --accent: #7fa98c;
      --soft-blue: #2c3a44;
      --soft-beige: #33302a;
      --soft-green: #2a352c;
      --border: #38423a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
    line-height: 1.5;
  }
  .page {
    display: none;
    padding: 28px 20px 40px;
    max-width: 440px;
    margin: 0 auto;
  }
  .page.active { display: block; }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text);
  }
  h2 {
    font-size: 1.25rem;
    font-weight: 500;
    margin-bottom: 16px;
  }
  p, .support {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 20px;
  }
  .mood-scale {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin: 24px 0;
  }
  .mood-btn {
    flex: 1;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 14px 4px;
    font-size: 1.5rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mood-btn.selected {
    border-color: var(--accent);
    background: var(--soft-green);
    transform: scale(1.05);
  }
  textarea {
    width: 100%;
    min-height: 80px;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    font-size: 1rem;
    font-family: inherit;
    resize: vertical;
    background: var(--card);
    color: var(--text);
    margin-bottom: 16px;
  }
  .btn {
    display: block;
    width: 100%;
    background: var(--accent);
    color: #16211a;
    border: none;
    border-radius: 16px;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.85; }
  .btn-secondary {
    background: var(--soft-blue);
    color: var(--text);
    margin-top: 12px;
  }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .message {
    background: var(--soft-green);
    border-radius: 16px;
    padding: 16px;
    margin-top: 20px;
    text-align: center;
    display: none;
  }
  .message.show { display: block; }
  /* Streak / stats */
  .stats-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    text-align: center;
  }
  .stat-card .num {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
  }
  .stat-card .label {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 2px;
  }
  /* Breathing */
  .pattern-picker {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .pattern-btn {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 4px;
    font-size: 0.8rem;
    color: var(--muted);
    cursor: pointer;
  }
  .pattern-btn.selected {
    border-color: var(--accent);
    background: var(--soft-green);
    color: var(--text);
    font-weight: 600;
  }
  .circle-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 260px;
    margin: 20px 0;
  }
  .circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: var(--soft-blue);
    transition: transform 4s ease-in-out;
  }
  .circle.inhale { transform: scale(1.6); background: var(--accent); }
  .circle.hold { transform: scale(1.6); background: var(--accent); }
  .circle.exhale { transform: scale(1); }
  .breath-text {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 500;
    min-height: 2rem;
  }
  .cycle-count {
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
    min-height: 1.2rem;
    margin-bottom: 8px;
  }
  .actions-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .action-card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--border);
  }
  .action-card.done {
    opacity: 0.6;
    background: var(--soft-green);
  }
  .action-card button {
    background: none;
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 6px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--text);
    flex-shrink: 0;
  }
  .history-item {
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
  }
  .history-item .date {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .sparkline {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 60px;
    margin-bottom: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px;
  }
  .sparkline .bar {
    flex: 1;
    background: var(--accent);
    border-radius: 4px 4px 0 0;
    min-height: 4px;
  }
  .nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    display: flex;
    justify-content: space-around;
    padding: 10px 0 14px;
    border-top: 1px solid var(--border);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
  }
  .nav button {
    background: none;
    border: none;
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 6px 10px;
  }
  .nav button.active { color: var(--text); font-weight: 600; }
  .nav button span { font-size: 1.3rem; }
  .summary {
    background: var(--soft-beige);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    margin-top: 24px;
  }
  .data-actions {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }
  .data-actions .btn { font-size: 0.85rem; padding: 12px; }
  #installBtn { display: none; }
</style>
</head>
<body>

<div id="page-hjem" class="page active">
  <h1 id="greeting">Hei. Du er trygg her.</h1>
  <p class="support" id="streakLine"></p>
  <p class="support">Hvordan har du det akkurat nå?</p>
  <div class="mood-scale" id="moodScale" role="group" aria-label="Velg humør">
    <button class="mood-btn" data-mood="1" aria-pressed="false" aria-label="Veldig lei meg">😔</button>
    <button class="mood-btn" data-mood="2" aria-pressed="false" aria-label="Lei meg">😕</button>
    <button class="mood-btn" data-mood="3" aria-pressed="false" aria-label="Nøytral">😐</button>
    <button class="mood-btn" data-mood="4" aria-pressed="false" aria-label="Bra">🙂</button>
    <button class="mood-btn" data-mood="5" aria-pressed="false" aria-label="Veldig bra">😌</button>
  </div>
  <textarea id="note" placeholder="Vil du skrive noen ord? (valgfritt)" aria-label="Notat"></textarea>
  <button class="btn" onclick="saveCheckin()">Lagre sjekk-inn</button>
  <div class="message" id="saveMsg" role="status" aria-live="polite">Takk. Det er bra at du sjekket inn.</div>
  <button class="btn btn-secondary" onclick="switchPage('pusterom', event)">Pust med meg</button>
  <button class="btn btn-ghost" id="installBtn" onclick="installApp()">📲 Legg til på hjemskjerm</button>
</div>

<div id="page-pusterom" class="page">
  <h1>Pusterom</h1>
  <p class="support">Velg tempo og følg sirkelen.</p>
  <div class="pattern-picker" id="patternPicker" role="group" aria-label="Velg pustemønster"></div>
  <div class="circle-wrap">
    <div class="circle" id="breathCircle"></div>
  </div>
  <div class="breath-text" id="breathText" role="status" aria-live="polite">Trykk start</div>
  <div class="cycle-count" id="cycleCount"></div>
  <button class="btn" id="breathBtn" onclick="toggleBreath()">Start</button>
</div>

<div id="page-grep" class="page">
  <h1>Små grep</h1>
  <p class="support">Enkle ting som kan hjelpe her og nå.</p>
  <div class="actions-list" id="actionsList"></div>
</div>

<div id="page-historikk" class="page">
  <h1>Din oversikt</h1>
  <div class="stats-row">
    <div class="stat-card">
      <div class="num" id="statStreak">0</div>
      <div class="label">Dager på rad</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statWeek">0</div>
      <div class="label">Denne uken</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statTotal">0</div>
      <div class="label">Totalt</div>
    </div>
  </div>
  <div class="sparkline" id="sparkline" aria-hidden="true"></div>
  <div id="historyList"></div>
  <div class="summary" id="weekSummary"></div>
  <div class="data-actions">
    <button class="btn btn-ghost" onclick="exportData()">⬇️ Eksporter data</button>
    <button class="btn btn-ghost" onclick="resetData()">🗑️ Nullstill</button>
  </div>
</div>

<nav class="nav">
  <button class="active" onclick="switchPage('hjem', event)"><span>🏠</span>Hjem</button>
  <button onclick="switchPage('pusterom', event)"><span>🌬️</span>Pusterom</button>
  <button onclick="switchPage('grep', event)"><span>✋</span>Små grep</button>
  <button onclick="switchPage('historikk', event)"><span>📖</span>Historikk</button>
</nav>

<script>
const actions = [
  { text: "Gå ut i frisk luft i 5 minutter", icon: "🌤️" },
  { text: "Drikk et glass vann sakte", icon: "💧" },
  { text: "Sett deg og kjenn føttene i gulvet", icon: "🦶" },
  { text: "Skriv ned én ting du er takknemlig for", icon: "📝" },
  { text: "Ta tre dype pust der du er", icon: "🌬️" },
  { text: "Legg telefonen bort i 10 minutter", icon: "📵" },
  { text: "Strekk armene over hodet", icon: "🙆" }
];

const BREATH_PATTERNS = {
  rolig: { label: "Rolig", phases: [
    { key: "inhale", text: "Pust inn…", ms: 4000 },
    { key: "hold", text: "Hold…", ms: 2000 },
    { key: "exhale", text: "Pust ut…", ms: 6000 }
  ]},
  boks: { label: "Boks", phases: [
    { key: "inhale", text: "Pust inn…", ms: 4000 },
    { key: "hold", text: "Hold…", ms: 4000 },
    { key: "exhale", text: "Pust ut…", ms: 4000 },
    { key: "hold", text: "Hold…", ms: 4000 }
  ]},
  "4-7-8": { label: "4-7-8", phases: [
    { key: "inhale", text: "Pust inn…", ms: 4000 },
    { key: "hold", text: "Hold…", ms: 7000 },
    { key: "exhale", text: "Pust ut…", ms: 8000 }
  ]}
};

let selectedMood = null;
let breathing = false;
let breathTimer = null;
let phaseIndex = 0;
let cycles = 0;
let selectedPattern = localStorage.getItem('breathPattern') || 'rolig';
let deferredInstallPrompt = null;

// ---------- storage helpers ----------
function getList(key) { return JSON.parse(localStorage.getItem(key) || '[]'); }
function setList(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
function dayKey(d) { return new Date(d).toDateString(); }

// ---------- mood check-in ----------
document.querySelectorAll('.mood-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mood-btn').forEach(b => { b.classList.remove('selected'); b.setAttribute('aria-pressed', 'false'); });
    btn.classList.add('selected');
    btn.setAttribute('aria-pressed', 'true');
    selectedMood = btn.dataset.mood;
  });
});

function saveCheckin() {
  if (!selectedMood) {
    alert('Velg hvordan du har det først.');
    return;
  }
  const note = document.getElementById('note').value.trim();
  const entry = { date: new Date().toISOString(), mood: selectedMood, note: note };
  const list = getList('checkins');
  list.unshift(entry);
  setList('checkins', list);
  document.getElementById('saveMsg').classList.add('show');
  document.getElementById('note').value = '';
  selectedMood = null;
  document.querySelectorAll('.mood-btn').forEach(b => { b.classList.remove('selected'); b.setAttribute('aria-pressed', 'false'); });
  setTimeout(() => document.getElementById('saveMsg').classList.remove('show'), 4000);
  renderHistory();
  renderGreeting();
}

// ---------- navigation ----------
function switchPage(name, evt) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  if (evt && evt.currentTarget) evt.currentTarget.classList.add('active');
  if (name === 'historikk') renderHistory();
  if (name === 'grep') renderActions();
  if (name === 'hjem') renderGreeting();
}

// ---------- breathing ----------
function renderPatternPicker() {
  const picker = document.getElementById('patternPicker');
  picker.innerHTML = '';
  Object.keys(BREATH_PATTERNS).forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'pattern-btn' + (key === selectedPattern ? ' selected' : '');
    btn.textContent = BREATH_PATTERNS[key].label;
    btn.setAttribute('aria-pressed', key === selectedPattern ? 'true' : 'false');
    btn.onclick = () => {
      if (breathing) return;
      selectedPattern = key;
      localStorage.setItem('breathPattern', key);
      renderPatternPicker();
    };
    picker.appendChild(btn);
  });
}

function toggleBreath() {
  const btn = document.getElementById('breathBtn');
  const circle = document.getElementById('breathCircle');
  const text = document.getElementById('breathText');
  if (!breathing) {
    breathing = true;
    cycles = 0;
    phaseIndex = 0;
    btn.textContent = 'Stopp';
    updateCycleCount();
    runBreathCycle();
  } else {
    breathing = false;
    clearTimeout(breathTimer);
    btn.textContent = 'Start';
    text.textContent = 'Trykk start';
    circle.className = 'circle';
    if (cycles > 0) logBreathSession();
    document.getElementById('cycleCount').textContent = '';
  }
}

function updateCycleCount() {
  document.getElementById('cycleCount').textContent = cycles > 0 ? `Runde ${cycles}` : '';
}

function runBreathCycle() {
  if (!breathing) return;
  const circle = document.getElementById('breathCircle');
  const text = document.getElementById('breathText');
  const pattern = BREATH_PATTERNS[selectedPattern];
  const phase = pattern.phases[phaseIndex];
  text.textContent = phase.text;
  circle.className = 'circle ' + phase.key;
  breathTimer = setTimeout(() => {
    phaseIndex++;
    if (phaseIndex >= pattern.phases.length) {
      phaseIndex = 0;
      cycles++;
      updateCycleCount();
    }
    runBreathCycle();
  }, phase.ms);
}

function logBreathSession() {
  const list = getList('breathSessions');
  list.unshift({ date: new Date().toISOString(), pattern: selectedPattern, cycles: cycles });
  setList('breathSessions', list);
}

// ---------- small actions ----------
function renderActions() {
  const done = JSON.parse(localStorage.getItem('doneActions') || '{}');
  const today = dayKey(new Date());
  const list = document.getElementById('actionsList');
  list.innerHTML = '';
  actions.forEach((a, i) => {
    const isDone = done[today] && done[today].includes(i);
    const card = document.createElement('div');
    card.className = 'action-card' + (isDone ? ' done' : '');
    card.innerHTML = `<span>${a.icon} ${a.text}</span><button onclick="toggleAction(${i})">${isDone ? '✓' : 'Gjør'}</button>`;
    list.appendChild(card);
  });
}

function toggleAction(i) {
  const done = JSON.parse(localStorage.getItem('doneActions') || '{}');
  const today = dayKey(new Date());
  if (!done[today]) done[today] = [];
  const idx = done[today].indexOf(i);
  if (idx > -1) done[today].splice(idx, 1);
  else done[today].push(i);
  localStorage.setItem('doneActions', JSON.stringify(done));
  renderActions();
}

// ---------- activity aggregation (for streak & weekly stats) ----------
function allActivityDates() {
  const dates = [];
  getList('checkins').forEach(e => dates.push(new Date(e.date)));
  getList('breathSessions').forEach(e => dates.push(new Date(e.date)));
  const done = JSON.parse(localStorage.getItem('doneActions') || '{}');
  Object.keys(done).forEach(dstr => { if (done[dstr].length > 0) dates.push(new Date(dstr)); });
  return dates;
}

function computeStreak() {
  const dayKeys = new Set(allActivityDates().map(d => dayKey(d)));
  let streak = 0;
  let cursor = new Date();
  while (dayKeys.has(dayKey(cursor))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function computeWeekCount() {
  const now = new Date();
  const weekAgo = new Date(now - 7 * 24 * 60 * 60 * 1000);
  return allActivityDates().filter(d => d > weekAgo).length;
}

function computeTotalCount() {
  return allActivityDates().length;
}

// ---------- greeting ----------
function renderGreeting() {
  const hour = new Date().getHours();
  let greet = 'Hei. Du er trygg her.';
  if (hour < 6) greet = 'God natt. Du er trygg her.';
  else if (hour < 10) greet = 'God morgen. Du er trygg her.';
  else if (hour < 18) greet = 'Hei. Du er trygg her.';
  else greet = 'God kveld. Du er trygg her.';
  document.getElementById('greeting').textContent = greet;

  const streak = computeStreak();
  const streakLine = document.getElementById('streakLine');
  streakLine.textContent = streak > 1
    ? `Du har tatt vare på deg selv ${streak} dager på rad. Bra jobbet.`
    : '';
}

// ---------- history page ----------
function renderHistory() {
  const list = getList('checkins');
  const container = document.getElementById('historyList');
  container.innerHTML = '';
  if (list.length === 0) {
    container.innerHTML = '<p class="support">Ingen sjekk-ins ennå. Det er greit.</p>';
  } else {
    list.slice(0, 20).forEach(e => {
      const d = new Date(e.date);
      const moodEmoji = ['', '😔', '😕', '😐', '🙂', '😌'][e.mood] || '😐';
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `<div class="date">${d.toLocaleDateString('no-NO', {weekday:'short', day:'numeric', month:'short'})} · ${moodEmoji}</div>${e.note ? '<div>' + escapeHtml(e.note) + '</div>' : ''}`;
      container.appendChild(item);
    });
  }

  document.getElementById('statStreak').textContent = computeStreak();
  document.getElementById('statWeek').textContent = computeWeekCount();
  document.getElementById('statTotal').textContent = computeTotalCount();

  const weekCount = computeWeekCount();
  document.getElementById('weekSummary').textContent =
    `Du har tatt vare på deg selv ${weekCount} ${weekCount === 1 ? 'gang' : 'ganger'} denne uken. Det er fint.`;

  renderSparkline(list);
}

function renderSparkline(checkins) {
  const spark = document.getElementById('sparkline');
  spark.innerHTML = '';
  const recent = checkins.slice(0, 14).reverse();
  if (recent.length === 0) {
    spark.style.display = 'none';
    return;
  }
  spark.style.display = 'flex';
  recent.forEach(e => {
    const bar = document.createElement('div');
    bar.className = 'bar';
    const pct = Math.max(10, (Number(e.mood) / 5) * 100);
    bar.style.height = pct + '%';
    spark.appendChild(bar);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- data export / reset ----------
function exportData() {
  const data = {
    checkins: getList('checkins'),
    breathSessions: getList('breathSessions'),
    doneActions: JSON.parse(localStorage.getItem('doneActions') || '{}'),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'pusterom-data.json';
  a.click();
  URL.revokeObjectURL(url);
}

function resetData() {
  if (!confirm('Er du sikker på at du vil slette all lagret data? Dette kan ikke angres.')) return;
  ['checkins', 'breathSessions', 'doneActions', 'breathPattern'].forEach(k => localStorage.removeItem(k));
  selectedPattern = 'rolig';
  renderPatternPicker();
  renderActions();
  renderHistory();
  renderGreeting();
}

// ---------- PWA install ----------
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.getElementById('installBtn').style.display = 'block';
});

function installApp() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.then && deferredInstallPrompt.then(() => {});
  deferredInstallPrompt.userChoice.finally(() => {
    deferredInstallPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
  });
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// ---------- init ----------
renderGreeting();
renderPatternPicker();
renderActions();
renderHistory();
</script>
</body>
</html>
