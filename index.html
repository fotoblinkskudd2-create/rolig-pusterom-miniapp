<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="Rolig – en enkel pusterom-app for å dempe stress og nedstemthet.">
<title>Pusterom – Rolig mini-app</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="page-hjem" class="page active">
  <h1>Hei. Du er trygg her.</h1>
  <p class="support">Hvordan har du det akkurat nå?</p>
  <div class="mood-scale" id="moodScale">
    <button class="mood-btn" data-mood="1" aria-label="Veldig lei meg">😔</button>
    <button class="mood-btn" data-mood="2" aria-label="Lei meg">😕</button>
    <button class="mood-btn" data-mood="3" aria-label="Nøytral">😐</button>
    <button class="mood-btn" data-mood="4" aria-label="Bra">🙂</button>
    <button class="mood-btn" data-mood="5" aria-label="Veldig bra">😌</button>
  </div>
  <textarea id="note" placeholder="Vil du skrive noen ord? (valgfritt)"></textarea>
  <button class="btn" id="checkinBtn">Lagre sjekk-inn</button>
  <div class="message" id="saveMsg">Takk. Det er bra at du sjekket inn.</div>
  <button class="btn btn-secondary" id="gotoPusteromBtn">Pust med meg</button>
</div>

<div id="page-pusterom" class="page">
  <h1>Pusterom</h1>
  <p class="support">Følg sirkelen. Pust rolig.</p>
  <div class="circle-wrap">
    <div class="circle" id="breathCircle"></div>
  </div>
  <div class="breath-text" id="breathText">Trykk start</div>
  <button class="btn" id="breathBtn">Start</button>
</div>

<div id="page-grep" class="page">
  <h1>Små grep</h1>
  <p class="support">Enkle ting som kan hjelpe her og nå.</p>
  <div class="actions-list" id="actionsList"></div>
</div>

<div id="page-historikk" class="page">
  <h1>Din oversikt</h1>
  <div id="historyList"></div>
  <div class="summary" id="weekSummary">Du har tatt vare på deg selv 0 ganger denne uken.</div>
</div>

<nav class="nav">
  <button class="active" data-page="hjem"><span>🏠</span>Hjem</button>
  <button data-page="pusterom"><span>🌬️</span>Pusterom</button>
  <button data-page="grep"><span>✋</span>Små grep</button>
  <button data-page="historikk"><span>📖</span>Historikk</button>
</nav>

<script src="app.js"></script>
</body>
</html>
