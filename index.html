<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pusterom – Rolig mini-app</title>
<style>
  :root {
    --bg: #f5f7f4;
    --card: #ffffff;
    --text: #3a4a3f;
    --muted: #7a8a7f;
    --accent: #a8c5b0;
    --soft-blue: #d4e4f0;
    --soft-beige: #f0e9df;
    --soft-green: #e0ebe3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
    line-height: 1.5;
  }
  .page {
    display: none;
    padding: 28px 20px 40px;
    max-width: 440px;
    margin: 0 auto;
  }
  .page.active { display: block; }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text);
  }
  h2 {
    font-size: 1.25rem;
    font-weight: 500;
    margin-bottom: 16px;
  }
  p, .support {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 20px;
  }
  .mood-scale {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin: 24px 0;
  }
  .mood-btn {
    flex: 1;
    background: var(--card);
    border: 2px solid #e5ebe6;
    border-radius: 16px;
    padding: 14px 4px;
    font-size: 1.5rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mood-btn.selected {
    border-color: var(--accent);
    background: var(--soft-green);
    transform: scale(1.05);
  }
  textarea {
    width: 100%;
    min-height: 80px;
    border: 1px solid #e0e6e1;
    border-radius: 16px;
    padding: 14px;
    font-size: 1rem;
    font-family: inherit;
    resize: vertical;
    background: var(--card);
    margin-bottom: 16px;
  }
  .btn {
    display: block;
    width: 100%;
    background: var(--accent);
    color: #2a3a2f;
    border: none;
    border-radius: 16px;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.85; }
  .btn-secondary {
    background: var(--soft-blue);
    margin-top: 12px;
  }
  .message {
    background: var(--soft-green);
    border-radius: 16px;
    padding: 16px;
    margin-top: 20px;
    text-align: center;
    display: none;
  }
  .message.show { display: block; }
  /* Breathing */
  .circle-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 260px;
    margin: 20px 0;
  }
  .circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: var(--soft-blue);
    transition: transform 4s ease-in-out;
  }
  .circle.inhale { transform: scale(1.6); background: var(--accent); }
  .circle.exhale { transform: scale(1); }
  .breath-text {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 500;
    min-height: 2rem;
  }
  .actions-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .action-card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #e8eee9;
  }
  .action-card.done {
    opacity: 0.6;
    background: var(--soft-green);
  }
  .action-card button {
    background: none;
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 6px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--text);
  }
  .history-item {
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid #e8eee9;
  }
  .history-item .date {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    display: flex;
    justify-content: space-around;
    padding: 10px 0 14px;
    border-top: 1px solid #e5ebe6;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
  }
  .nav button {
    background: none;
    border: none;
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 6px 10px;
  }
  .nav button.active { color: var(--text); font-weight: 600; }
  .nav button span { font-size: 1.3rem; }
  .summary {
    background: var(--soft-beige);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    margin-top: 24px;
  }
  .gold-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 8, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .gold-overlay.show { display: flex; }
  #goldCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .gold-card {
    position: relative;
    background: var(--card);
    border-radius: 20px;
    padding: 32px 24px 24px;
    max-width: 320px;
    width: 85%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    z-index: 2;
  }
  .gold-card h2 { margin-bottom: 8px; }
</style>
</head>
<body>

<div id="page-hjem" class="page active">
  <h1>Hei. Du er trygg her.</h1>
  <p class="support">Hvordan har du det akkurat nå?</p>
  <div class="mood-scale" id="moodScale">
    <button class="mood-btn" data-mood="1">😔</button>
    <button class="mood-btn" data-mood="2">😕</button>
    <button class="mood-btn" data-mood="3">😐</button>
    <button class="mood-btn" data-mood="4">🙂</button>
    <button class="mood-btn" data-mood="5">😌</button>
  </div>
  <textarea id="note" placeholder="Vil du skrive noen ord? (valgfritt)"></textarea>
  <button class="btn" onclick="saveCheckin()">Lagre sjekk-inn</button>
  <div class="message" id="saveMsg">Takk. Det er bra at du sjekket inn.</div>
  <button class="btn btn-secondary" onclick="switchPage('pusterom')">Pust med meg</button>
</div>

<div id="page-pusterom" class="page">
  <h1>Pusterom</h1>
  <p class="support">Følg sirkelen. Pust rolig.</p>
  <div class="circle-wrap">
    <div class="circle" id="breathCircle"></div>
  </div>
  <div class="breath-text" id="breathText">Trykk start</div>
  <button class="btn" id="breathBtn" onclick="toggleBreath()">Start</button>
</div>

<div id="page-grep" class="page">
  <h1>Små grep</h1>
  <p class="support">Enkle ting som kan hjelpe her og nå.</p>
  <div class="actions-list" id="actionsList"></div>
</div>

<div id="page-historikk" class="page">
  <h1>Din oversikt</h1>
  <div id="historyList"></div>
  <div class="summary" id="weekSummary">Du har tatt vare på deg selv 0 ganger denne uken.</div>
</div>

<nav class="nav">
  <button class="active" onclick="switchPage('hjem')"><span>🏠</span>Hjem</button>
  <button onclick="switchPage('pusterom')"><span>🌬️</span>Pusterom</button>
  <button onclick="switchPage('grep')"><span>✋</span>Små grep</button>
  <button onclick="switchPage('historikk')"><span>📖</span>Historikk</button>
</nav>

<div class="gold-overlay" id="goldOverlay">
  <canvas id="goldCanvas"></canvas>
  <div class="gold-card">
    <h2>🌟 Gyllent øyeblikk</h2>
    <p id="goldStreak"></p>
    <button class="btn" onclick="closeGoldMoment()">Takk</button>
  </div>
</div>

<script>
const actions = [
  "Gå ut i frisk luft i 5 minutter",
  "Drikk et glass vann sakte",
  "Sett deg og kjenn føttene i gulvet",
  "Skriv ned én ting du er takknemlig for",
  "Ta tre dype pust der du er",
  "Legg telefonen bort i 10 minutter",
  "Strekk armene over hodet"
];

let selectedMood = null;
let breathing = false;
let breathInterval = null;
let phase = 0; // 0 inhale, 1 hold, 2 exhale
let breathCycles = 0;
let goldRunning = false;

document.querySelectorAll('.mood-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMood = btn.dataset.mood;
  });
});

function saveCheckin() {
  if (!selectedMood) {
    alert('Velg hvordan du har det først.');
    return;
  }
  const note = document.getElementById('note').value.trim();
  const entry = {
    date: new Date().toISOString(),
    mood: selectedMood,
    note: note
  };
  const list = JSON.parse(localStorage.getItem('checkins') || '[]');
  list.unshift(entry);
  localStorage.setItem('checkins', JSON.stringify(list));
  document.getElementById('saveMsg').classList.add('show');
  document.getElementById('note').value = '';
  selectedMood = null;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  setTimeout(() => document.getElementById('saveMsg').classList.remove('show'), 4000);
  renderHistory();
  checkGoldMoment();
}

function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  if (name === 'historikk') renderHistory();
  if (name === 'grep') renderActions();
}

function toggleBreath() {
  const btn = document.getElementById('breathBtn');
  const circle = document.getElementById('breathCircle');
  const text = document.getElementById('breathText');
  if (!breathing) {
    breathing = true;
    btn.textContent = 'Stopp';
    phase = 0;
    runBreathCycle();
  } else {
    breathing = false;
    clearTimeout(breathInterval);
    btn.textContent = 'Start';
    text.textContent = 'Trykk start';
    circle.className = 'circle';
  }
}

function runBreathCycle() {
  if (!breathing) return;
  const circle = document.getElementById('breathCircle');
  const text = document.getElementById('breathText');
  if (phase === 0) {
    text.textContent = 'Pust inn…';
    circle.className = 'circle inhale';
    breathInterval = setTimeout(() => { phase = 1; runBreathCycle(); }, 4000);
  } else if (phase === 1) {
    text.textContent = 'Hold…';
    breathInterval = setTimeout(() => { phase = 2; runBreathCycle(); }, 2000);
  } else {
    text.textContent = 'Pust ut…';
    circle.className = 'circle exhale';
    breathInterval = setTimeout(() => {
      phase = 0;
      breathCycles++;
      if (breathCycles === 1) markBreathDone();
      runBreathCycle();
    }, 6000);
  }
}

function markBreathDone() {
  const done = JSON.parse(localStorage.getItem('breathDone') || '{}');
  done[new Date().toDateString()] = true;
  localStorage.setItem('breathDone', JSON.stringify(done));
  checkGoldMoment();
}

function renderActions() {
  const done = JSON.parse(localStorage.getItem('doneActions') || '{}');
  const today = new Date().toDateString();
  const list = document.getElementById('actionsList');
  list.innerHTML = '';
  actions.forEach((a, i) => {
    const isDone = done[today] && done[today].includes(i);
    const card = document.createElement('div');
    card.className = 'action-card' + (isDone ? ' done' : '');
    card.innerHTML = `<span>${a}</span><button onclick="toggleAction(${i})">${isDone ? '✓' : 'Gjør'}</button>`;
    list.appendChild(card);
  });
}

function toggleAction(i) {
  const done = JSON.parse(localStorage.getItem('doneActions') || '{}');
  const today = new Date().toDateString();
  if (!done[today]) done[today] = [];
  const idx = done[today].indexOf(i);
  if (idx > -1) done[today].splice(idx, 1);
  else done[today].push(i);
  localStorage.setItem('doneActions', JSON.stringify(done));
  renderActions();
  checkGoldMoment();
}

function renderHistory() {
  const list = JSON.parse(localStorage.getItem('checkins') || '[]');
  const container = document.getElementById('historyList');
  container.innerHTML = '';
  if (list.length === 0) {
    container.innerHTML = '<p class="support">Ingen sjekk-ins ennå. Det er greit.</p>';
  } else {
    list.slice(0, 20).forEach(e => {
      const d = new Date(e.date);
      const moodEmoji = ['', '😔', '😕', '😐', '🙂', '😌'][e.mood] || '😐';
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `<div class="date">${d.toLocaleDateString('no-NO', {weekday:'short', day:'numeric', month:'short'})} · ${moodEmoji}</div>${e.note ? '<div>' + e.note + '</div>' : ''}`;
      container.appendChild(item);
    });
  }
  // week count
  const now = new Date();
  const weekAgo = new Date(now - 7*24*60*60*1000);
  const weekCount = list.filter(e => new Date(e.date) > weekAgo).length;
  const streak = calcStreak();
  const streakNote = streak > 1 ? ` 🔥 ${streak} dager på rad.` : '';
  document.getElementById('weekSummary').textContent = `Du har tatt vare på deg selv ${weekCount} ganger denne uken. Det er fint.${streakNote}`;
}

function calcStreak() {
  const checkins = JSON.parse(localStorage.getItem('checkins') || '[]');
  const days = new Set(checkins.map(e => new Date(e.date).toDateString()));
  let streak = 0;
  let cursor = new Date();
  while (days.has(cursor.toDateString())) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function checkGoldMoment() {
  const today = new Date().toDateString();
  const checkins = JSON.parse(localStorage.getItem('checkins') || '[]');
  const hasCheckin = checkins.some(e => new Date(e.date).toDateString() === today);
  const doneActions = JSON.parse(localStorage.getItem('doneActions') || '{}');
  const hasAction = (doneActions[today] || []).length > 0;
  const hasBreathed = !!JSON.parse(localStorage.getItem('breathDone') || '{}')[today];
  if (!(hasCheckin && hasAction && hasBreathed)) return;
  const shown = JSON.parse(localStorage.getItem('goldShown') || '{}');
  if (shown[today]) return;
  shown[today] = true;
  localStorage.setItem('goldShown', JSON.stringify(shown));
  showGoldMoment();
}

function showGoldMoment() {
  const streak = calcStreak();
  document.getElementById('goldStreak').textContent = streak > 1
    ? `${streak} dager på rad. Du bygger noe fint.`
    : 'Du sjekket inn, pustet, og tok et lite grep for deg selv i dag. Tre gode ting.';
  document.getElementById('goldOverlay').classList.add('show');
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    runGoldParticles();
  }
}

function closeGoldMoment() {
  document.getElementById('goldOverlay').classList.remove('show');
  goldRunning = false;
}

function runGoldParticles() {
  const canvas = document.getElementById('goldCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#e8c468', '#f0d98c', '#d4af37', '#fff3c4'];
  const particles = Array.from({ length: 70 }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height * 0.6,
    r: 2 + Math.random() * 4,
    speed: 1 + Math.random() * 2.5,
    drift: (Math.random() - 0.5) * 1.2,
    color: colors[Math.floor(Math.random() * colors.length)],
    opacity: 0.6 + Math.random() * 0.4
  }));
  goldRunning = true;
  let elapsed = 0;
  function frame() {
    if (!goldRunning) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.y += p.speed;
      p.x += p.drift;
      if (p.y > canvas.height + 20) p.y = -20;
      ctx.beginPath();
      ctx.globalAlpha = p.opacity;
      ctx.fillStyle = p.color;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    elapsed += 16;
    if (elapsed < 4500 && goldRunning) requestAnimationFrame(frame);
    else goldRunning = false;
  }
  requestAnimationFrame(frame);
}

// init
renderActions();
renderHistory();
</script>
</body>
</html>
