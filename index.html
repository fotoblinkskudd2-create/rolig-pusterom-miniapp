<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1f1c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pusterom">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Pusterom – Rolig mini-app</title>
<style>
  :root {
    --bg: #f5f7f4;
    --card: #ffffff;
    --text: #3a4a3f;
    --muted: #5d6e62;
    --line: #e2e9e4;
    --accent: #a8c5b0;
    --on-accent: #2a3a2f;
    --focus: #3a4a3f;
    --soft-blue: #d4e4f0;
    --soft-beige: #f0e9df;
    --soft-green: #e0ebe3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1f1c;
      --card: #243029;
      --text: #e0ebe3;
      --muted: #a7b5aa;
      --line: #33423a;
      --accent: #8fb49b;
      --on-accent: #111814;
      --focus: #e0ebe3;
      --soft-blue: #2c3d4a;
      --soft-beige: #3a332b;
      --soft-green: #2b3a30;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1f1c;
    --card: #243029;
    --text: #e0ebe3;
    --muted: #a7b5aa;
    --line: #33423a;
    --accent: #8fb49b;
    --on-accent: #111814;
    --focus: #e0ebe3;
    --soft-blue: #2c3d4a;
    --soft-beige: #3a332b;
    --soft-green: #2b3a30;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
    line-height: 1.5;
  }
  button, textarea { color: inherit; }
  button:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  .page {
    display: none;
    padding: 28px 20px 40px;
    max-width: 440px;
    margin: 0 auto;
  }
  .page.active { display: block; }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text);
  }
  h2 {
    font-size: 1.25rem;
    font-weight: 500;
    margin-bottom: 16px;
  }
  p, .support {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 20px;
  }
  .privacy {
    font-size: 0.85rem;
    margin: -8px 0 24px;
  }
  .mood-scale {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin: 24px 0;
  }
  .mood-btn {
    flex: 1;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 14px 4px;
    font-size: 1.5rem;
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, background 0.2s;
  }
  .mood-btn.selected {
    border-color: var(--accent);
    background: var(--soft-green);
    transform: scale(1.05);
  }
  textarea {
    width: 100%;
    min-height: 80px;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    font-size: 1rem;
    font-family: inherit;
    resize: vertical;
    background: var(--card);
    margin-bottom: 16px;
  }
  .btn {
    display: block;
    width: 100%;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 16px;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.85; }
  .btn-secondary {
    background: var(--soft-blue);
    margin-top: 12px;
  }
  .hint {
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
    min-height: 1.5em;
    margin: 12px 0 0;
  }
  .message {
    background: var(--soft-green);
    border-radius: 16px;
    padding: 16px;
    margin-top: 20px;
    text-align: center;
    display: none;
  }
  .message.show { display: block; }
  /* Breathing */
  .circle-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 260px;
    margin: 20px 0;
  }
  .circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: var(--soft-blue);
    transition: transform 4s ease-in-out, background 4s ease-in-out;
  }
  .circle.inhale { transform: scale(1.6); background: var(--accent); }
  .circle.exhale { transform: scale(1); transition-duration: 6s; }
  .breath-text {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 500;
    min-height: 2rem;
  }
  .actions-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .action-card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--line);
  }
  .action-card.done {
    opacity: 0.7;
    background: var(--soft-green);
  }
  .action-card button {
    flex-shrink: 0;
    background: none;
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 8px 14px;
    min-width: 64px;
    font-size: 0.9rem;
    cursor: pointer;
    color: var(--text);
  }
  .history-item {
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid var(--line);
  }
  .history-item .date {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    display: flex;
    justify-content: space-around;
    padding: 10px 0 calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
  }
  .nav button {
    background: none;
    border: none;
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 6px 10px;
    min-width: 64px;
    min-height: 48px;
  }
  .nav button.active { color: var(--text); font-weight: 600; }
  .nav button span { font-size: 1.3rem; }
  .summary {
    background: var(--soft-beige);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    margin-top: 24px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div id="page-hjem" class="page active">
  <h1>Hei. Du er trygg her.</h1>
  <p class="support">Hvordan har du det akkurat nå?</p>
  <p class="privacy">🔒 Alt blir på denne enheten.</p>
  <div class="mood-scale" id="moodScale" role="group" aria-label="Hvordan har du det?">
    <button class="mood-btn" data-mood="1" aria-label="Ikke bra" aria-pressed="false">😔</button>
    <button class="mood-btn" data-mood="2" aria-label="Litt tungt" aria-pressed="false">😕</button>
    <button class="mood-btn" data-mood="3" aria-label="Nøytralt" aria-pressed="false">😐</button>
    <button class="mood-btn" data-mood="4" aria-label="Ganske bra" aria-pressed="false">🙂</button>
    <button class="mood-btn" data-mood="5" aria-label="Rolig" aria-pressed="false">😌</button>
  </div>
  <textarea id="note" aria-label="Notat (valgfritt)" placeholder="Vil du skrive noen ord? (valgfritt)"></textarea>
  <button class="btn" onclick="saveCheckin()">Lagre sjekk-inn</button>
  <p class="hint" id="formHint" role="status"></p>
  <div class="message" id="saveMsg" role="status">Takk. Det er bra at du sjekket inn.</div>
  <button class="btn btn-secondary" onclick="switchPage('pusterom')">Pust med meg</button>
</div>

<div id="page-pusterom" class="page">
  <h1>Pusterom</h1>
  <p class="support">Følg sirkelen. Pust rolig.</p>
  <div class="circle-wrap">
    <div class="circle" id="breathCircle" aria-hidden="true"></div>
  </div>
  <div class="breath-text" id="breathText" aria-live="polite">Trykk start</div>
  <button class="btn" id="breathBtn" onclick="toggleBreath()">Start</button>
</div>

<div id="page-grep" class="page">
  <h1>Små grep</h1>
  <p class="support">Enkle ting som kan hjelpe her og nå.</p>
  <div class="actions-list" id="actionsList"></div>
</div>

<div id="page-historikk" class="page">
  <h1>Din oversikt</h1>
  <div id="historyList"></div>
  <div class="summary" id="weekSummary">Du har tatt vare på deg selv 0 ganger denne uken.</div>
</div>

<nav class="nav" aria-label="Hovedmeny">
  <button class="active" data-page="hjem" onclick="switchPage('hjem')"><span aria-hidden="true">🏠</span>Hjem</button>
  <button data-page="pusterom" onclick="switchPage('pusterom')"><span aria-hidden="true">🌬️</span>Pusterom</button>
  <button data-page="grep" onclick="switchPage('grep')"><span aria-hidden="true">✋</span>Små grep</button>
  <button data-page="historikk" onclick="switchPage('historikk')"><span aria-hidden="true">📖</span>Historikk</button>
</nav>

<script>
const actions = [
  "Gå ut i frisk luft i 5 minutter",
  "Drikk et glass vann sakte",
  "Sett deg og kjenn føttene i gulvet",
  "Skriv ned én ting du er takknemlig for",
  "Ta tre dype pust der du er",
  "Legg telefonen bort i 10 minutter",
  "Strekk armene over hodet"
];

let selectedMood = null;
let breathing = false;
let breathInterval = null;
let phase = 0; // 0 inhale, 1 hold, 2 exhale
let hintTimeout = null;

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showHint(text) {
  const hint = document.getElementById('formHint');
  hint.textContent = text;
  clearTimeout(hintTimeout);
  hintTimeout = setTimeout(() => { hint.textContent = ''; }, 4000);
}

document.querySelectorAll('.mood-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mood-btn').forEach(b => {
      b.classList.remove('selected');
      b.setAttribute('aria-pressed', 'false');
    });
    btn.classList.add('selected');
    btn.setAttribute('aria-pressed', 'true');
    selectedMood = btn.dataset.mood;
    document.getElementById('formHint').textContent = '';
  });
});

function saveCheckin() {
  if (!selectedMood) {
    showHint('Velg hvordan du har det først.');
    return;
  }
  const note = document.getElementById('note').value.trim();
  const entry = {
    date: new Date().toISOString(),
    mood: selectedMood,
    note: note
  };
  const list = JSON.parse(localStorage.getItem('checkins') || '[]');
  list.unshift(entry);
  localStorage.setItem('checkins', JSON.stringify(list));
  document.getElementById('saveMsg').classList.add('show');
  document.getElementById('note').value = '';
  selectedMood = null;
  document.querySelectorAll('.mood-btn').forEach(b => {
    b.classList.remove('selected');
    b.setAttribute('aria-pressed', 'false');
  });
  setTimeout(() => document.getElementById('saveMsg').classList.remove('show'), 4000);
  renderHistory();
}

function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b => {
    const isActive = b.dataset.page === name;
    b.classList.toggle('active', isActive);
    if (isActive) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  if (name === 'historikk') renderHistory();
  if (name === 'grep') renderActions();
}

function toggleBreath() {
  const btn = document.getElementById('breathBtn');
  const circle = document.getElementById('breathCircle');
  const text = document.getElementById('breathText');
  if (!breathing) {
    breathing = true;
    btn.textContent = 'Stopp';
    phase = 0;
    runBreathCycle();
  } else {
    breathing = false;
    clearTimeout(breathInterval);
    btn.textContent = 'Start';
    text.textContent = 'Trykk start';
    circle.className = 'circle';
  }
}

function runBreathCycle() {
  if (!breathing) return;
  const circle = document.getElementById('breathCircle');
  const text = document.getElementById('breathText');
  if (phase === 0) {
    text.textContent = 'Pust inn…';
    circle.className = 'circle inhale';
    breathInterval = setTimeout(() => { phase = 1; runBreathCycle(); }, 4000);
  } else if (phase === 1) {
    text.textContent = 'Hold…';
    breathInterval = setTimeout(() => { phase = 2; runBreathCycle(); }, 2000);
  } else {
    text.textContent = 'Pust ut…';
    circle.className = 'circle exhale';
    breathInterval = setTimeout(() => { phase = 0; runBreathCycle(); }, 6000);
  }
}

function renderActions() {
  const done = JSON.parse(localStorage.getItem('doneActions') || '{}');
  const today = new Date().toDateString();
  const list = document.getElementById('actionsList');
  list.innerHTML = '';
  actions.forEach((a, i) => {
    const isDone = done[today] && done[today].includes(i);
    const card = document.createElement('div');
    card.className = 'action-card' + (isDone ? ' done' : '');
    card.innerHTML = `<span>${escapeHtml(a)}</span><button onclick="toggleAction(${i})" aria-pressed="${isDone}">${isDone ? '✓ Gjort' : 'Gjør'}</button>`;
    list.appendChild(card);
  });
}

function toggleAction(i) {
  const done = JSON.parse(localStorage.getItem('doneActions') || '{}');
  const today = new Date().toDateString();
  if (!done[today]) done[today] = [];
  const idx = done[today].indexOf(i);
  if (idx > -1) done[today].splice(idx, 1);
  else done[today].push(i);
  localStorage.setItem('doneActions', JSON.stringify(done));
  renderActions();
}

function renderHistory() {
  const list = JSON.parse(localStorage.getItem('checkins') || '[]');
  const container = document.getElementById('historyList');
  container.innerHTML = '';
  if (list.length === 0) {
    container.innerHTML = '<p class="support">Ingen sjekk-ins ennå. Det er greit.</p>';
  } else {
    list.slice(0, 20).forEach(e => {
      const d = new Date(e.date);
      const moodEmoji = ['', '😔', '😕', '😐', '🙂', '😌'][e.mood] || '😐';
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `<div class="date">${d.toLocaleDateString('no-NO', {weekday:'short', day:'numeric', month:'short'})} · ${moodEmoji}</div>${e.note ? '<div>' + escapeHtml(e.note) + '</div>' : ''}`;
      container.appendChild(item);
    });
  }
  // week count
  const now = new Date();
  const weekAgo = new Date(now - 7*24*60*60*1000);
  const weekCount = list.filter(e => new Date(e.date) > weekAgo).length;
  document.getElementById('weekSummary').textContent = `Du har tatt vare på deg selv ${weekCount} ganger denne uken. Det er fint.`;
}

// init
renderActions();
renderHistory();
</script>
</body>
</html>
