<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pusterom – Rolig mini-app</title>
<style>
  :root {
    --bg: #f5f7f4;
    --card: #ffffff;
    --text: #3a4a3f;
    --muted: #7a8a7f;
    --accent: #a8c5b0;
    --soft-blue: #d4e4f0;
    --soft-beige: #f0e9df;
    --soft-green: #e0ebe3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
    line-height: 1.5;
  }
  .page {
    display: none;
    padding: 28px 20px 40px;
    max-width: 440px;
    margin: 0 auto;
  }
  .page.active { display: block; }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text);
  }
  h2 {
    font-size: 1.25rem;
    font-weight: 500;
    margin-bottom: 16px;
  }
  p, .support {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 20px;
  }
  .mood-scale {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin: 24px 0;
  }
  .mood-btn {
    flex: 1;
    background: var(--card);
    border: 2px solid #e5ebe6;
    border-radius: 16px;
    padding: 14px 4px;
    font-size: 1.5rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mood-btn.selected {
    border-color: var(--accent);
    background: var(--soft-green);
    transform: scale(1.05);
  }
  textarea {
    width: 100%;
    min-height: 80px;
    border: 1px solid #e0e6e1;
    border-radius: 16px;
    padding: 14px;
    font-size: 1rem;
    font-family: inherit;
    resize: vertical;
    background: var(--card);
    margin-bottom: 16px;
  }
  .btn {
    display: block;
    width: 100%;
    background: var(--accent);
    color: #2a3a2f;
    border: none;
    border-radius: 16px;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.85; }
  .btn-secondary {
    background: var(--soft-blue);
    margin-top: 12px;
  }
  .message {
    background: var(--soft-green);
    border-radius: 16px;
    padding: 16px;
    margin-top: 20px;
    text-align: center;
    display: none;
  }
  .message.show { display: block; }
  /* Breathing */
  .circle-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 260px;
    margin: 20px 0;
  }
  .circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: var(--soft-blue);
    transition: transform 4s ease-in-out;
  }
  .circle.inhale { transform: scale(1.6); background: var(--accent); }
  .circle.exhale { transform: scale(1); }
  .breath-text {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 500;
    min-height: 2rem;
  }
  .actions-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .action-card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #e8eee9;
  }
  .action-card.done {
    opacity: 0.6;
    background: var(--soft-green);
  }
  .action-card button {
    background: none;
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 6px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--text);
  }
  .history-item {
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid #e8eee9;
  }
  .history-item .date {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    display: flex;
    justify-content: space-around;
    padding: 10px 0 14px;
    border-top: 1px solid #e5ebe6;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
  }
  .nav button {
    background: none;
    border: none;
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 6px 10px;
  }
  .nav button.active { color: var(--text); font-weight: 600; }
  .nav button span { font-size: 1.3rem; }
  .summary {
    background: var(--soft-beige);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    margin-top: 24px;
  }
  .stats-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    flex: 1;
    background: var(--card);
    border-radius: 16px;
    padding: 14px 6px;
    text-align: center;
    border: 1px solid #e8eee9;
  }
  .stat-num {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
  }
  .stat-label {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 2px;
    line-height: 1.2;
  }
  .chart-card {
    background: var(--card);
    border-radius: 16px;
    padding: 18px 16px;
    border: 1px solid #e8eee9;
    margin-bottom: 20px;
  }
  .chart-title {
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text);
  }
  #moodChart {
    width: 100%;
    height: 100px;
    display: block;
  }
  .chart-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 0.72rem;
    color: var(--muted);
  }
  .insight-card {
    background: var(--soft-beige);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    margin-bottom: 24px;
    font-size: 0.95rem;
  }
  .section-title {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 12px;
  }
</style>
</head>
<body>

<div id="page-hjem" class="page active">
  <h1>Hei. Du er trygg her.</h1>
  <p class="support">Hvordan har du det akkurat nå?</p>
  <div class="mood-scale" id="moodScale">
    <button class="mood-btn" data-mood="1">😔</button>
    <button class="mood-btn" data-mood="2">😕</button>
    <button class="mood-btn" data-mood="3">😐</button>
    <button class="mood-btn" data-mood="4">🙂</button>
    <button class="mood-btn" data-mood="5">😌</button>
  </div>
  <textarea id="note" placeholder="Vil du skrive noen ord? (valgfritt)"></textarea>
  <button class="btn" onclick="saveCheckin()">Lagre sjekk-inn</button>
  <div class="message" id="saveMsg">Takk. Det er bra at du sjekket inn.</div>
  <button class="btn btn-secondary" onclick="switchPage('pusterom')">Pust med meg</button>
</div>

<div id="page-pusterom" class="page">
  <h1>Pusterom</h1>
  <p class="support">Følg sirkelen. Pust rolig.</p>
  <div class="circle-wrap">
    <div class="circle" id="breathCircle"></div>
  </div>
  <div class="breath-text" id="breathText">Trykk start</div>
  <button class="btn" id="breathBtn" onclick="toggleBreath()">Start</button>
</div>

<div id="page-grep" class="page">
  <h1>Små grep</h1>
  <p class="support">Enkle ting som kan hjelpe her og nå.</p>
  <div class="actions-list" id="actionsList"></div>
</div>

<div id="page-historikk" class="page">
  <h1>Din oversikt</h1>
  <div class="stats-row" id="statsRow"></div>
  <div class="chart-card">
    <div class="chart-title">Humør siste 14 dager</div>
    <svg id="moodChart" viewBox="0 0 300 100" preserveAspectRatio="none"></svg>
    <div class="chart-labels" id="chartLabels"></div>
  </div>
  <div class="insight-card" id="insightCard"></div>
  <div class="section-title">Nylige sjekk-inn</div>
  <div id="historyList"></div>
</div>

<nav class="nav">
  <button class="active" onclick="switchPage('hjem')"><span>🏠</span>Hjem</button>
  <button onclick="switchPage('pusterom')"><span>🌬️</span>Pusterom</button>
  <button onclick="switchPage('grep')"><span>✋</span>Små grep</button>
  <button onclick="switchPage('historikk')"><span>📖</span>Historikk</button>
</nav>

<script>
const actions = [
  "Gå ut i frisk luft i 5 minutter",
  "Drikk et glass vann sakte",
  "Sett deg og kjenn føttene i gulvet",
  "Skriv ned én ting du er takknemlig for",
  "Ta tre dype pust der du er",
  "Legg telefonen bort i 10 minutter",
  "Strekk armene over hodet"
];

let selectedMood = null;
let breathing = false;
let breathInterval = null;
let phase = 0; // 0 inhale, 1 hold, 2 exhale

document.querySelectorAll('.mood-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMood = btn.dataset.mood;
  });
});

function saveCheckin() {
  if (!selectedMood) {
    alert('Velg hvordan du har det først.');
    return;
  }
  const note = document.getElementById('note').value.trim();
  const entry = {
    date: new Date().toISOString(),
    mood: selectedMood,
    note: note
  };
  const list = JSON.parse(localStorage.getItem('checkins') || '[]');
  list.unshift(entry);
  localStorage.setItem('checkins', JSON.stringify(list));
  document.getElementById('saveMsg').classList.add('show');
  document.getElementById('note').value = '';
  selectedMood = null;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  setTimeout(() => document.getElementById('saveMsg').classList.remove('show'), 4000);
  renderHistory();
}

function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  if (name === 'historikk') renderHistory();
  if (name === 'grep') renderActions();
}

function toggleBreath() {
  const btn = document.getElementById('breathBtn');
  const circle = document.getElementById('breathCircle');
  const text = document.getElementById('breathText');
  if (!breathing) {
    breathing = true;
    btn.textContent = 'Stopp';
    phase = 0;
    runBreathCycle();
  } else {
    breathing = false;
    clearTimeout(breathInterval);
    btn.textContent = 'Start';
    text.textContent = 'Trykk start';
    circle.className = 'circle';
  }
}

function runBreathCycle() {
  if (!breathing) return;
  const circle = document.getElementById('breathCircle');
  const text = document.getElementById('breathText');
  if (phase === 0) {
    text.textContent = 'Pust inn…';
    circle.className = 'circle inhale';
    breathInterval = setTimeout(() => { phase = 1; runBreathCycle(); }, 4000);
  } else if (phase === 1) {
    text.textContent = 'Hold…';
    breathInterval = setTimeout(() => { phase = 2; runBreathCycle(); }, 2000);
  } else {
    text.textContent = 'Pust ut…';
    circle.className = 'circle exhale';
    breathInterval = setTimeout(() => { phase = 0; runBreathCycle(); }, 6000);
  }
}

function renderActions() {
  const done = JSON.parse(localStorage.getItem('doneActions') || '{}');
  const today = new Date().toDateString();
  const list = document.getElementById('actionsList');
  list.innerHTML = '';
  actions.forEach((a, i) => {
    const isDone = done[today] && done[today].includes(i);
    const card = document.createElement('div');
    card.className = 'action-card' + (isDone ? ' done' : '');
    card.innerHTML = `<span>${a}</span><button onclick="toggleAction(${i})">${isDone ? '✓' : 'Gjør'}</button>`;
    list.appendChild(card);
  });
}

function toggleAction(i) {
  const done = JSON.parse(localStorage.getItem('doneActions') || '{}');
  const today = new Date().toDateString();
  if (!done[today]) done[today] = [];
  const idx = done[today].indexOf(i);
  if (idx > -1) done[today].splice(idx, 1);
  else done[today].push(i);
  localStorage.setItem('doneActions', JSON.stringify(done));
  renderActions();
}

function renderHistory() {
  const list = JSON.parse(localStorage.getItem('checkins') || '[]');
  const container = document.getElementById('historyList');
  container.innerHTML = '';
  if (list.length === 0) {
    container.innerHTML = '<p class="support">Ingen sjekk-ins ennå. Det er greit.</p>';
  } else {
    list.slice(0, 20).forEach(e => {
      const d = new Date(e.date);
      const moodEmoji = ['', '😔', '😕', '😐', '🙂', '😌'][e.mood] || '😐';
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `<div class="date">${d.toLocaleDateString('no-NO', {weekday:'short', day:'numeric', month:'short'})} · ${moodEmoji}</div>${e.note ? '<div>' + e.note + '</div>' : ''}`;
      container.appendChild(item);
    });
  }
  renderStats(list);
  renderChart(list);
  renderInsight(list);
}

function dayKey(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

function totalActionsDone() {
  const done = JSON.parse(localStorage.getItem('doneActions') || '{}');
  return Object.values(done).reduce((sum, arr) => sum + arr.length, 0);
}

function computeStreak(list) {
  const days = new Set(list.map(e => dayKey(e.date)));
  let cursor = new Date();
  cursor.setHours(0, 0, 0, 0);
  if (!days.has(cursor.getTime())) {
    cursor = new Date(cursor.getTime() - 24 * 60 * 60 * 1000);
  }
  let streak = 0;
  while (days.has(cursor.getTime())) {
    streak++;
    cursor = new Date(cursor.getTime() - 24 * 60 * 60 * 1000);
  }
  return streak;
}

function renderStats(list) {
  const row = document.getElementById('statsRow');
  row.innerHTML = `
    <div class="stat-card"><div class="stat-num">${computeStreak(list)}</div><div class="stat-label">dager på rad</div></div>
    <div class="stat-card"><div class="stat-num">${list.length}</div><div class="stat-label">sjekk-inn totalt</div></div>
    <div class="stat-card"><div class="stat-num">${totalActionsDone()}</div><div class="stat-label">grep gjort</div></div>
  `;
}

function renderChart(list) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const days = [];
  for (let i = 13; i >= 0; i--) {
    days.push(new Date(today.getTime() - i * 24 * 60 * 60 * 1000));
  }
  const byDay = {};
  list.forEach(e => {
    const key = dayKey(e.date);
    (byDay[key] = byDay[key] || []).push(Number(e.mood));
  });
  const points = days.map(d => {
    const arr = byDay[d.getTime()];
    return arr && arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
  });

  const w = 300, h = 100, pad = 8;
  const xStep = (w - pad * 2) / (days.length - 1);
  const yFor = v => h - pad - ((v - 1) / 4) * (h - pad * 2);

  let path = '';
  let dots = '';
  let drawing = false;
  points.forEach((v, i) => {
    if (v === null) { drawing = false; return; }
    const x = pad + i * xStep;
    const y = yFor(v);
    path += (drawing ? ' L ' : 'M ') + x.toFixed(1) + ' ' + y.toFixed(1);
    drawing = true;
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#a8c5b0" />`;
  });

  const svg = document.getElementById('moodChart');
  if (points.every(v => v === null)) {
    svg.innerHTML = '<text x="150" y="54" text-anchor="middle" font-size="10" fill="#7a8a7f">Ingen data ennå</text>';
  } else {
    svg.innerHTML = `<path d="${path}" fill="none" stroke="#a8c5b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />${dots}`;
  }

  document.getElementById('chartLabels').innerHTML =
    `<span>${days[0].toLocaleDateString('no-NO', { day: 'numeric', month: 'short' })}</span><span>I dag</span>`;
}

function renderInsight(list) {
  const card = document.getElementById('insightCard');
  if (list.length === 0) {
    card.textContent = 'Ingen sjekk-inn ennå. Det er greit — start når du er klar.';
    return;
  }
  const now = new Date();
  const day = 24 * 60 * 60 * 1000;
  const last7 = list.filter(e => new Date(e.date) > new Date(now - 7 * day));
  const prev7 = list.filter(e => {
    const t = new Date(e.date);
    return t <= new Date(now - 7 * day) && t > new Date(now - 14 * day);
  });
  const avg = arr => arr.length ? arr.reduce((s, e) => s + Number(e.mood), 0) / arr.length : null;
  const a1 = avg(last7), a2 = avg(prev7);

  let msg;
  if (last7.length === 0) {
    msg = 'Ingen sjekk-inn denne uken ennå. Et lite sjekk-inn kan være en fin start.';
  } else if (a2 === null) {
    msg = `Du har sjekket inn ${last7.length} ${last7.length === 1 ? 'gang' : 'ganger'} denne uken. Fint at du tar deg tid.`;
  } else if (a1 - a2 >= 0.4) {
    msg = 'Det ser ut som denne uken har vært litt lysere enn forrige. Godt jobbet.';
  } else if (a2 - a1 >= 0.4) {
    msg = 'Denne uken har vært tyngre enn forrige. Det er greit — du er her, og det teller.';
  } else {
    msg = 'Humøret ditt har vært ganske stabilt denne uken.';
  }
  card.textContent = msg;
}

// init
renderActions();
renderHistory();
</script>
</body>
</html>
