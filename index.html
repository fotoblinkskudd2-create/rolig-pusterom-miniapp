<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pusterom – Rolig mini-app</title>
<meta name="theme-color" content="#f5f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1f1c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pusterom">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #f5f7f4;
    --card: #ffffff;
    --text: #3a4a3f;
    --muted: #7a8a7f;
    --accent: #a8c5b0;
    --soft-blue: #d4e4f0;
    --soft-beige: #f0e9df;
    --soft-green: #e0ebe3;
    --line: #e5ebe6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1f1c;
      --card: #242b26;
      --text: #e0ebe3;
      --muted: #9aaa9f;
      --accent: #a8c5b0;
      --soft-blue: #2e3d48;
      --soft-beige: #3a342b;
      --soft-green: #2c3a30;
      --line: #34403a;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
    line-height: 1.5;
  }
  .page {
    display: none;
    padding: 28px 20px 40px;
    max-width: 440px;
    margin: 0 auto;
  }
  .page.active { display: block; }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text);
  }
  h2 {
    font-size: 1.25rem;
    font-weight: 500;
    margin-bottom: 16px;
  }
  p, .support {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 20px;
  }
  .mood-scale {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin: 24px 0;
  }
  .mood-btn {
    flex: 1;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 14px 4px;
    font-size: 1.5rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mood-btn.selected {
    border-color: var(--accent);
    background: var(--soft-green);
    transform: scale(1.05);
  }
  textarea {
    width: 100%;
    min-height: 80px;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    font-size: 1rem;
    font-family: inherit;
    resize: vertical;
    background: var(--card);
    color: var(--text);
    margin-bottom: 16px;
  }
  .btn {
    display: block;
    width: 100%;
    background: var(--accent);
    color: #2a3a2f;
    border: none;
    border-radius: 16px;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.85; }
  .btn-secondary {
    background: var(--soft-blue);
    margin-top: 12px;
  }
  .message {
    background: var(--soft-green);
    border-radius: 16px;
    padding: 16px;
    margin-top: 20px;
    text-align: center;
    display: none;
  }
  .message.show { display: block; }
  .message.hint { background: var(--soft-beige); }
  .local-note { font-size: 0.82rem; margin: 28px 0 0; text-align: center; }
  .mirror-link { display: block; text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 16px; }
  /* Breathing */
  .circle-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 260px;
    margin: 20px 0;
  }
  .circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: var(--soft-blue);
    transition: transform 4s ease-in-out;
  }
  .circle.inhale { transform: scale(1.6); background: var(--accent); }
  .circle.exhale { transform: scale(1); }
  .breath-text {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 500;
    min-height: 2rem;
  }
  .actions-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .action-card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid var(--line);
  }
  .action-card.done {
    opacity: 0.6;
    background: var(--soft-green);
  }
  .action-card button {
    background: none;
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 6px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--text);
  }
  .history-item {
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid var(--line);
  }
  .history-item .date {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    display: flex;
    justify-content: space-around;
    padding: 10px 0 14px;
    border-top: 1px solid var(--line);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
  }
  .nav button {
    background: none;
    border: none;
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 6px 10px;
  }
  .nav button.active { color: var(--text); font-weight: 600; }
  .nav button span { font-size: 1.3rem; }
  .summary {
    background: var(--soft-beige);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    margin-top: 24px;
  }
  @media (prefers-color-scheme: dark) {
    .btn-secondary { color: var(--text); }
  }
</style>
</head>
<body>

<div id="page-hjem" class="page active">
  <h1>Hei. Du er trygg her.</h1>
  <p class="support">Hvordan har du det akkurat nå?</p>
  <div class="mood-scale" id="moodScale">
    <button class="mood-btn" data-mood="1">😔</button>
    <button class="mood-btn" data-mood="2">😕</button>
    <button class="mood-btn" data-mood="3">😐</button>
    <button class="mood-btn" data-mood="4">🙂</button>
    <button class="mood-btn" data-mood="5">😌</button>
  </div>
  <textarea id="note" placeholder="Vil du skrive noen ord? (valgfritt)"></textarea>
  <button class="btn" onclick="saveCheckin()">Lagre sjekk-inn</button>
  <div class="message" id="saveMsg" role="status" aria-live="polite"></div>
  <button class="btn btn-secondary" onclick="switchPage('pusterom')">Pust med meg</button>
  <p class="support local-note" id="localNote">Alt blir på denne enheten. Ingen konto, ingen sky.</p>
</div>

<div id="page-pusterom" class="page">
  <h1>Pusterom</h1>
  <p class="support">Følg sirkelen. Pust rolig.</p>
  <div class="circle-wrap">
    <div class="circle" id="breathCircle"></div>
  </div>
  <div class="breath-text" id="breathText">Trykk start</div>
  <button class="btn" id="breathBtn" onclick="toggleBreath()">Start</button>
</div>

<div id="page-grep" class="page">
  <h1>Små grep</h1>
  <p class="support">Enkle ting som kan hjelpe her og nå.</p>
  <div class="actions-list" id="actionsList"></div>
</div>

<div id="page-historikk" class="page">
  <h1>Din oversikt</h1>
  <div id="historyList"></div>
  <div class="summary" id="weekSummary">Du har tatt vare på deg selv 0 ganger denne uken.</div>
  <button class="btn btn-secondary" id="exportBtn" onclick="exportHistory()">Ta historikken med deg</button>
  <a class="mirror-link" href="isolation-mirror.html">Isolation Mirror →</a>
</div>

<nav class="nav">
  <button class="active" data-page="hjem" onclick="switchPage('hjem')"><span>🏠</span>Hjem</button>
  <button data-page="pusterom" onclick="switchPage('pusterom')"><span>🌬️</span>Pusterom</button>
  <button data-page="grep" onclick="switchPage('grep')"><span>✋</span>Små grep</button>
  <button data-page="historikk" onclick="switchPage('historikk')"><span>📖</span>Historikk</button>
</nav>

<script>
const actions = [
  "Gå ut i frisk luft i 5 minutter",
  "Drikk et glass vann sakte",
  "Sett deg og kjenn føttene i gulvet",
  "Skriv ned én ting du er takknemlig for",
  "Ta tre dype pust der du er",
  "Legg telefonen bort i 10 minutter",
  "Strekk armene over hodet"
];

let selectedMood = null;
let breathing = false;
let breathInterval = null;
let phase = 0; // 0 inhale, 1 hold, 2 exhale

document.querySelectorAll('.mood-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMood = btn.dataset.mood;
  });
});

const MOODS = ['', '😔', '😕', '😐', '🙂', '😌'];
let msgTimer = null;

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function loadJSON(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    return v == null ? fallback : v;
  } catch (e) {
    return fallback;
  }
}

function showMsg(text, hint) {
  const msg = document.getElementById('saveMsg');
  msg.textContent = text;
  msg.classList.toggle('hint', !!hint);
  msg.classList.add('show');
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => msg.classList.remove('show'), 4000);
}

function saveCheckin() {
  if (!selectedMood) {
    showMsg('Velg hvordan du har det først.', true);
    return;
  }
  const note = document.getElementById('note').value.trim();
  const entry = {
    date: new Date().toISOString(),
    mood: selectedMood,
    note: note
  };
  const list = loadJSON('checkins', []);
  list.unshift(entry);
  try {
    localStorage.setItem('checkins', JSON.stringify(list));
  } catch (e) {
    showMsg('Fikk ikke lagret på denne enheten (privat modus?).', true);
    return;
  }
  showMsg('Takk. Det er bra at du sjekket inn.');
  document.getElementById('note').value = '';
  selectedMood = null;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  renderHistory();
}

function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  const navBtn = document.querySelector('.nav button[data-page="' + name + '"]');
  if (navBtn) navBtn.classList.add('active');
  window.scrollTo(0, 0);
  if (name !== 'pusterom' && breathing) toggleBreath();
  if (name === 'historikk') renderHistory();
  if (name === 'grep') renderActions();
}

function toggleBreath() {
  const btn = document.getElementById('breathBtn');
  const circle = document.getElementById('breathCircle');
  const text = document.getElementById('breathText');
  if (!breathing) {
    breathing = true;
    btn.textContent = 'Stopp';
    phase = 0;
    runBreathCycle();
  } else {
    breathing = false;
    clearTimeout(breathInterval);
    btn.textContent = 'Start';
    text.textContent = 'Trykk start';
    circle.className = 'circle';
  }
}

function runBreathCycle() {
  if (!breathing) return;
  const circle = document.getElementById('breathCircle');
  const text = document.getElementById('breathText');
  if (phase === 0) {
    text.textContent = 'Pust inn…';
    circle.className = 'circle inhale';
    breathInterval = setTimeout(() => { phase = 1; runBreathCycle(); }, 4000);
  } else if (phase === 1) {
    text.textContent = 'Hold…';
    breathInterval = setTimeout(() => { phase = 2; runBreathCycle(); }, 2000);
  } else {
    text.textContent = 'Pust ut…';
    circle.className = 'circle exhale';
    breathInterval = setTimeout(() => { phase = 0; runBreathCycle(); }, 6000);
  }
}

function renderActions() {
  const done = loadJSON('doneActions', {});
  const today = new Date().toDateString();
  const list = document.getElementById('actionsList');
  list.innerHTML = '';
  actions.forEach((a, i) => {
    const isDone = done[today] && done[today].includes(i);
    const card = document.createElement('div');
    card.className = 'action-card' + (isDone ? ' done' : '');
    card.innerHTML = `<span>${a}</span><button onclick="toggleAction(${i})">${isDone ? '✓' : 'Gjør'}</button>`;
    list.appendChild(card);
  });
}

function toggleAction(i) {
  const done = loadJSON('doneActions', {});
  const today = new Date().toDateString();
  // keep only today; old days are never read
  Object.keys(done).forEach(k => { if (k !== today) delete done[k]; });
  if (!done[today]) done[today] = [];
  const idx = done[today].indexOf(i);
  if (idx > -1) done[today].splice(idx, 1);
  else done[today].push(i);
  localStorage.setItem('doneActions', JSON.stringify(done));
  renderActions();
}

function renderHistory() {
  const list = loadJSON('checkins', []);
  const container = document.getElementById('historyList');
  container.innerHTML = '';
  if (list.length === 0) {
    container.innerHTML = '<p class="support">Ingen sjekk-ins ennå. Det er greit.</p>';
  } else {
    list.slice(0, 20).forEach(e => {
      const d = new Date(e.date);
      const moodEmoji = MOODS[e.mood] || '😐';
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `<div class="date">${d.toLocaleDateString('no-NO', {weekday:'short', day:'numeric', month:'short'})} · ${moodEmoji}</div>${e.note ? '<div>' + escapeHtml(e.note) + '</div>' : ''}`;
      container.appendChild(item);
    });
  }
  // week count
  const now = new Date();
  const weekAgo = new Date(now - 7*24*60*60*1000);
  const weekCount = list.filter(e => new Date(e.date) > weekAgo).length;
  document.getElementById('weekSummary').textContent = `Du har tatt vare på deg selv ${weekCount} ganger denne uken. Det er fint.`;
  document.getElementById('exportBtn').style.display = list.length ? 'block' : 'none';
}

function exportHistory() {
  const list = loadJSON('checkins', []);
  const lines = ['Pusterom – historikk', 'Eksportert ' + new Date().toLocaleString('no-NO'), ''];
  list.forEach(e => {
    const d = new Date(e.date).toLocaleString('no-NO', {weekday:'short', day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
    lines.push(d + '  humør ' + e.mood + '/5' + (e.note ? '  ' + e.note.replace(/\s+/g, ' ') : ''));
  });
  const blob = new Blob([lines.join('\n') + '\n'], {type: 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pusterom-historikk.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// init
renderActions();
renderHistory();
</script>
</body>
</html>
