<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#a8c5b0">
<meta name="description" content="Rolig mini-app for å dempe stress og nedstemthet.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Pusterom – Rolig mini-app</title>
<style>
  :root {
    --bg: #f5f7f4;
    --card: #ffffff;
    --text: #3a4a3f;
    --muted: #7a8a7f;
    --accent: #a8c5b0;
    --soft-blue: #d4e4f0;
    --soft-beige: #f0e9df;
    --soft-green: #e0ebe3;
    --border: #e5ebe6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b201c;
      --card: #242b25;
      --text: #e3ebe4;
      --muted: #93a396;
      --accent: #7fa88c;
      --soft-blue: #2c3a44;
      --soft-beige: #33302a;
      --soft-green: #2a352c;
      --border: #333d34;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
    line-height: 1.5;
  }
  .page {
    display: none;
    padding: 28px 20px 40px;
    max-width: 440px;
    margin: 0 auto;
  }
  .page.active { display: block; }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text);
  }
  h2 {
    font-size: 1.25rem;
    font-weight: 500;
    margin-bottom: 16px;
  }
  p, .support {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 20px;
  }
  .mood-scale {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin: 24px 0;
  }
  .mood-btn {
    flex: 1;
    background: var(--card);
    border: 2px solid #e5ebe6;
    border-radius: 16px;
    padding: 14px 4px;
    font-size: 1.5rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mood-btn.selected {
    border-color: var(--accent);
    background: var(--soft-green);
    transform: scale(1.05);
  }
  textarea {
    width: 100%;
    min-height: 80px;
    border: 1px solid #e0e6e1;
    border-radius: 16px;
    padding: 14px;
    font-size: 1rem;
    font-family: inherit;
    resize: vertical;
    background: var(--card);
    margin-bottom: 16px;
  }
  .btn {
    display: block;
    width: 100%;
    background: var(--accent);
    color: #2a3a2f;
    border: none;
    border-radius: 16px;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.85; }
  .btn-secondary {
    background: var(--soft-blue);
    margin-top: 12px;
  }
  .message {
    background: var(--soft-green);
    border-radius: 16px;
    padding: 16px;
    margin-top: 20px;
    text-align: center;
    display: none;
  }
  .message.show { display: block; }
  /* Breathing */
  .circle-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 260px;
    margin: 20px 0;
  }
  .circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: var(--soft-blue);
    transition: transform 4s ease-in-out;
  }
  .circle.inhale { transform: scale(1.6); background: var(--accent); }
  .circle.exhale { transform: scale(1); }
  .breath-text {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 500;
    min-height: 2rem;
  }
  .actions-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .action-card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #e8eee9;
  }
  .action-card.done {
    opacity: 0.6;
    background: var(--soft-green);
  }
  .action-card button {
    background: none;
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 6px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--text);
  }
  .history-item {
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid #e8eee9;
  }
  .history-item .date {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    display: flex;
    justify-content: space-around;
    padding: 10px 0 14px;
    border-top: 1px solid #e5ebe6;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
  }
  .nav button {
    background: none;
    border: none;
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 6px 10px;
  }
  .nav button.active { color: var(--text); font-weight: 600; }
  .nav button span { font-size: 1.3rem; }
  .summary {
    background: var(--soft-beige);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    margin-top: 24px;
  }
  .streak {
    background: var(--soft-blue);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 20px;
    font-size: 0.95rem;
  }
  .pattern-select {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .pattern-btn {
    flex: 1;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 10px 4px;
    font-size: 0.8rem;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .pattern-btn.selected {
    border-color: var(--accent);
    background: var(--soft-green);
    color: var(--text);
    font-weight: 600;
  }
  .week-chart {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 12px;
    margin-bottom: 20px;
  }
  .week-day {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .week-day .emoji { font-size: 1.2rem; opacity: 0.35; }
  .week-day .emoji.filled { opacity: 1; }
  .week-day .label { font-size: 0.7rem; color: var(--muted); }
  .grep-total {
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 16px;
  }
</style>
</head>
<body>

<div id="page-hjem" class="page active">
  <h1>Hei. Du er trygg her.</h1>
  <div class="streak" id="streakBox"></div>
  <p class="support">Hvordan har du det akkurat nå?</p>
  <div class="mood-scale" id="moodScale">
    <button class="mood-btn" data-mood="1">😔</button>
    <button class="mood-btn" data-mood="2">😕</button>
    <button class="mood-btn" data-mood="3">😐</button>
    <button class="mood-btn" data-mood="4">🙂</button>
    <button class="mood-btn" data-mood="5">😌</button>
  </div>
  <textarea id="note" placeholder="Vil du skrive noen ord? (valgfritt)"></textarea>
  <button class="btn" onclick="saveCheckin()">Lagre sjekk-inn</button>
  <div class="message" id="saveMsg">Takk. Det er bra at du sjekket inn.</div>
  <button class="btn btn-secondary" onclick="switchPage('pusterom')">Pust med meg</button>
</div>

<div id="page-pusterom" class="page">
  <h1>Pusterom</h1>
  <p class="support">Følg sirkelen. Pust rolig.</p>
  <div class="pattern-select" id="patternSelect"></div>
  <div class="circle-wrap">
    <div class="circle" id="breathCircle"></div>
  </div>
  <div class="breath-text" id="breathText">Trykk start</div>
  <button class="btn" id="breathBtn" onclick="toggleBreath()">Start</button>
</div>

<div id="page-grep" class="page">
  <h1>Små grep</h1>
  <p class="support">Enkle ting som kan hjelpe her og nå.</p>
  <div class="actions-list" id="actionsList"></div>
  <div class="grep-total" id="grepTotal"></div>
</div>

<div id="page-historikk" class="page">
  <h1>Din oversikt</h1>
  <div class="week-chart" id="weekChart"></div>
  <div id="historyList"></div>
  <div class="summary" id="weekSummary">Du har tatt vare på deg selv 0 ganger denne uken.</div>
</div>

<nav class="nav">
  <button class="active" onclick="switchPage('hjem')"><span>🏠</span>Hjem</button>
  <button onclick="switchPage('pusterom')"><span>🌬️</span>Pusterom</button>
  <button onclick="switchPage('grep')"><span>✋</span>Små grep</button>
  <button onclick="switchPage('historikk')"><span>📖</span>Historikk</button>
</nav>

<script>
const actions = [
  "Gå ut i frisk luft i 5 minutter",
  "Drikk et glass vann sakte",
  "Sett deg og kjenn føttene i gulvet",
  "Skriv ned én ting du er takknemlig for",
  "Ta tre dype pust der du er",
  "Legg telefonen bort i 10 minutter",
  "Strekk armene over hodet"
];

const patterns = {
  rolig:  { label: 'Rolig',        inhale: 4000, hold: 2000, exhale: 6000 },
  boks:   { label: 'Boks-pust',    inhale: 4000, hold: 4000, exhale: 4000, hold2: 4000 },
  firsju: { label: '4-7-8',        inhale: 4000, hold: 7000, exhale: 8000 }
};
let selectedPattern = localStorage.getItem('breathPattern') || 'rolig';

let selectedMood = null;
let breathing = false;
let breathInterval = null;
let phase = 0; // 0 inhale, 1 hold, 2 exhale, 3 hold2 (boks only)

function renderPatternSelect() {
  const wrap = document.getElementById('patternSelect');
  wrap.innerHTML = '';
  Object.keys(patterns).forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'pattern-btn' + (key === selectedPattern ? ' selected' : '');
    btn.textContent = patterns[key].label;
    btn.onclick = () => {
      if (breathing) toggleBreath();
      selectedPattern = key;
      localStorage.setItem('breathPattern', key);
      renderPatternSelect();
    };
    wrap.appendChild(btn);
  });
}
renderPatternSelect();

document.querySelectorAll('.mood-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMood = btn.dataset.mood;
  });
});

function saveCheckin() {
  if (!selectedMood) {
    alert('Velg hvordan du har det først.');
    return;
  }
  const note = document.getElementById('note').value.trim();
  const entry = {
    date: new Date().toISOString(),
    mood: selectedMood,
    note: note
  };
  const list = JSON.parse(localStorage.getItem('checkins') || '[]');
  list.unshift(entry);
  localStorage.setItem('checkins', JSON.stringify(list));
  document.getElementById('saveMsg').classList.add('show');
  document.getElementById('note').value = '';
  selectedMood = null;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  setTimeout(() => document.getElementById('saveMsg').classList.remove('show'), 4000);
  renderHistory();
  renderStreak();
}

function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  if (name === 'historikk') renderHistory();
  if (name === 'grep') renderActions();
  if (name === 'hjem') renderStreak();
}

function computeStreak() {
  const list = JSON.parse(localStorage.getItem('checkins') || '[]');
  if (list.length === 0) return 0;
  const days = new Set(list.map(e => new Date(e.date).toDateString()));
  let streak = 0;
  let cursor = new Date();
  if (!days.has(cursor.toDateString())) {
    cursor.setDate(cursor.getDate() - 1);
    if (!days.has(cursor.toDateString())) return 0;
  }
  while (days.has(cursor.toDateString())) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function renderStreak() {
  const streak = computeStreak();
  const box = document.getElementById('streakBox');
  box.textContent = streak === 0
    ? 'Ingen aktiv streak ennå. Sjekk inn i dag for å starte en.'
    : `🔥 ${streak} ${streak === 1 ? 'dag' : 'dager'} på rad med sjekk-inn.`;
}

function toggleBreath() {
  const btn = document.getElementById('breathBtn');
  const circle = document.getElementById('breathCircle');
  const text = document.getElementById('breathText');
  if (!breathing) {
    breathing = true;
    btn.textContent = 'Stopp';
    phase = 0;
    runBreathCycle();
  } else {
    breathing = false;
    clearTimeout(breathInterval);
    btn.textContent = 'Start';
    text.textContent = 'Trykk start';
    circle.className = 'circle';
  }
}

function runBreathCycle() {
  if (!breathing) return;
  const circle = document.getElementById('breathCircle');
  const text = document.getElementById('breathText');
  const p = patterns[selectedPattern];
  if (phase === 0) {
    text.textContent = 'Pust inn…';
    circle.className = 'circle inhale';
    breathInterval = setTimeout(() => { phase = 1; runBreathCycle(); }, p.inhale);
  } else if (phase === 1) {
    text.textContent = 'Hold…';
    circle.className = 'circle inhale';
    breathInterval = setTimeout(() => { phase = 2; runBreathCycle(); }, p.hold);
  } else if (phase === 2) {
    text.textContent = 'Pust ut…';
    circle.className = 'circle exhale';
    breathInterval = setTimeout(() => { phase = p.hold2 ? 3 : 0; runBreathCycle(); }, p.exhale);
  } else {
    text.textContent = 'Hold…';
    circle.className = 'circle exhale';
    breathInterval = setTimeout(() => { phase = 0; runBreathCycle(); }, p.hold2);
  }
}

function renderActions() {
  const done = JSON.parse(localStorage.getItem('doneActions') || '{}');
  const today = new Date().toDateString();
  const list = document.getElementById('actionsList');
  list.innerHTML = '';
  actions.forEach((a, i) => {
    const isDone = done[today] && done[today].includes(i);
    const card = document.createElement('div');
    card.className = 'action-card' + (isDone ? ' done' : '');
    card.innerHTML = `<span>${a}</span><button onclick="toggleAction(${i})">${isDone ? '✓' : 'Gjør'}</button>`;
    list.appendChild(card);
  });
  const total = Object.values(done).reduce((sum, arr) => sum + arr.length, 0);
  document.getElementById('grepTotal').textContent = total === 0
    ? ''
    : `Du har gjort ${total} små grep totalt. Bra jobbet.`;
}

function toggleAction(i) {
  const done = JSON.parse(localStorage.getItem('doneActions') || '{}');
  const today = new Date().toDateString();
  if (!done[today]) done[today] = [];
  const idx = done[today].indexOf(i);
  if (idx > -1) done[today].splice(idx, 1);
  else done[today].push(i);
  localStorage.setItem('doneActions', JSON.stringify(done));
  renderActions();
}

function renderWeekChart() {
  const list = JSON.parse(localStorage.getItem('checkins') || '[]');
  const byDay = {};
  list.forEach(e => {
    const key = new Date(e.date).toDateString();
    if (!byDay[key] || new Date(e.date) > new Date(byDay[key].date)) byDay[key] = e;
  });
  const chart = document.getElementById('weekChart');
  chart.innerHTML = '';
  const moodEmoji = ['', '😔', '😕', '😐', '🙂', '😌'];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const entry = byDay[d.toDateString()];
    const day = document.createElement('div');
    day.className = 'week-day';
    day.innerHTML = `<span class="emoji${entry ? ' filled' : ''}">${entry ? moodEmoji[entry.mood] || '😐' : '·'}</span><span class="label">${d.toLocaleDateString('no-NO', {weekday:'narrow'})}</span>`;
    chart.appendChild(day);
  }
}

function renderHistory() {
  renderWeekChart();
  const list = JSON.parse(localStorage.getItem('checkins') || '[]');
  const container = document.getElementById('historyList');
  container.innerHTML = '';
  if (list.length === 0) {
    container.innerHTML = '<p class="support">Ingen sjekk-ins ennå. Det er greit.</p>';
  } else {
    list.slice(0, 20).forEach(e => {
      const d = new Date(e.date);
      const moodEmoji = ['', '😔', '😕', '😐', '🙂', '😌'][e.mood] || '😐';
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `<div class="date">${d.toLocaleDateString('no-NO', {weekday:'short', day:'numeric', month:'short'})} · ${moodEmoji}</div>${e.note ? '<div>' + e.note + '</div>' : ''}`;
      container.appendChild(item);
    });
  }
  // week count
  const now = new Date();
  const weekAgo = new Date(now - 7*24*60*60*1000);
  const weekCount = list.filter(e => new Date(e.date) > weekAgo).length;
  document.getElementById('weekSummary').textContent = `Du har tatt vare på deg selv ${weekCount} ganger denne uken. Det er fint.`;
}

// init
renderActions();
renderHistory();
renderStreak();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
