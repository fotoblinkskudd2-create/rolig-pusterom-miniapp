<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#a8c5b0">
<meta name="description" content="Rolig mini-app for å dempe stress og nedstemthet.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Pusterom – Rolig mini-app</title>
<style>
  :root {
    --bg: #f5f7f4;
    --card: #ffffff;
    --text: #3a4a3f;
    --muted: #7a8a7f;
    --accent: #a8c5b0;
    --soft-blue: #d4e4f0;
    --soft-beige: #f0e9df;
    --soft-green: #e0ebe3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
    line-height: 1.5;
    transition: background-color 1.5s ease;
  }
  .page {
    display: none;
    padding: 28px 20px 40px;
    max-width: 440px;
    margin: 0 auto;
  }
  .page.active { display: block; }
  h1 {
    font-size: 1.6rem;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text);
  }
  h2 {
    font-size: 1.25rem;
    font-weight: 500;
    margin-bottom: 16px;
  }
  p, .support {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 20px;
  }
  .mood-scale {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin: 24px 0;
  }
  .mood-btn {
    flex: 1;
    background: var(--card);
    border: 2px solid #e5ebe6;
    border-radius: 16px;
    padding: 14px 4px;
    font-size: 1.5rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mood-btn.selected {
    border-color: var(--accent);
    background: var(--soft-green);
    transform: scale(1.05);
  }
  textarea {
    width: 100%;
    min-height: 80px;
    border: 1px solid #e0e6e1;
    border-radius: 16px;
    padding: 14px;
    font-size: 1rem;
    font-family: inherit;
    resize: vertical;
    background: var(--card);
    margin-bottom: 16px;
  }
  .btn {
    display: block;
    width: 100%;
    background: var(--accent);
    color: #2a3a2f;
    border: none;
    border-radius: 16px;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.85; }
  .btn-secondary {
    background: var(--soft-blue);
    margin-top: 12px;
  }
  .message {
    background: var(--soft-green);
    border-radius: 16px;
    padding: 16px;
    margin-top: 20px;
    text-align: center;
    display: none;
  }
  .message.show { display: block; }
  /* Breathing */
  .circle-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 260px;
    margin: 20px 0;
  }
  .circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: var(--soft-blue);
    transition: transform 4s ease-in-out;
  }
  .circle.inhale { transform: scale(1.6); background: var(--accent); }
  .circle.exhale { transform: scale(1); }
  .breath-text {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 500;
    min-height: 2rem;
  }
  .pattern-select {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .pattern-btn {
    flex: 1;
    background: var(--card);
    border: 2px solid #e5ebe6;
    border-radius: 12px;
    padding: 10px 4px;
    font-size: 0.8rem;
    line-height: 1.3;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .pattern-btn.selected {
    border-color: var(--accent);
    background: var(--soft-green);
    color: var(--text);
    font-weight: 600;
  }
  @media (prefers-reduced-motion: reduce) {
    .circle, body { transition: none !important; }
  }
  .actions-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .action-card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #e8eee9;
  }
  .action-card.done {
    opacity: 0.6;
    background: var(--soft-green);
  }
  .action-card button {
    background: none;
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 6px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--text);
  }
  .history-item {
    background: var(--card);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid #e8eee9;
  }
  .history-item {
    position: relative;
  }
  .history-item .date {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .history-item .del-btn {
    position: absolute;
    top: 10px;
    right: 12px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    padding: 4px;
  }
  .streak-badge {
    background: var(--soft-beige);
    border-radius: 16px;
    padding: 14px;
    text-align: center;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .trend-chart {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 70px;
    margin-bottom: 4px;
  }
  .trend-bar {
    flex: 1;
    background: var(--soft-blue);
    border-radius: 6px 6px 2px 2px;
    min-height: 6px;
  }
  .trend-bar.has-data { background: var(--accent); }
  .trend-labels {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
  }
  .trend-labels span {
    flex: 1;
    text-align: center;
    font-size: 0.7rem;
    color: var(--muted);
  }
  .nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    display: flex;
    justify-content: space-around;
    padding: 10px 0 14px;
    border-top: 1px solid #e5ebe6;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
  }
  .nav button {
    background: none;
    border: none;
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 6px 10px;
  }
  .nav button.active { color: var(--text); font-weight: 600; }
  .nav button span { font-size: 1.3rem; }
  .summary {
    background: var(--soft-beige);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
    margin-top: 24px;
  }
</style>
</head>
<body>

<div id="page-hjem" class="page active">
  <h1>Hei. Du er trygg her.</h1>
  <p class="support">Hvordan har du det akkurat nå?</p>
  <div class="mood-scale" id="moodScale">
    <button class="mood-btn" data-mood="1">😔</button>
    <button class="mood-btn" data-mood="2">😕</button>
    <button class="mood-btn" data-mood="3">😐</button>
    <button class="mood-btn" data-mood="4">🙂</button>
    <button class="mood-btn" data-mood="5">😌</button>
  </div>
  <textarea id="note" placeholder="Vil du skrive noen ord? (valgfritt)"></textarea>
  <button class="btn" onclick="saveCheckin()">Lagre sjekk-inn</button>
  <div class="message" id="saveMsg">Takk. Det er bra at du sjekket inn.</div>
  <button class="btn btn-secondary" onclick="switchPage('pusterom')">Pust med meg</button>
</div>

<div id="page-pusterom" class="page">
  <h1>Pusterom</h1>
  <p class="support">Følg sirkelen. Pust rolig.</p>
  <div class="pattern-select" id="patternSelect">
    <button class="pattern-btn selected" data-pattern="rolig">Rolig<br>4-2-6</button>
    <button class="pattern-btn" data-pattern="box">Boks<br>4-4-4-4</button>
    <button class="pattern-btn" data-pattern="dyp">Dyp<br>4-7-8</button>
  </div>
  <div class="circle-wrap">
    <div class="circle" id="breathCircle"></div>
  </div>
  <div class="breath-text" id="breathText" aria-live="polite">Trykk start</div>
  <button class="btn" id="breathBtn" onclick="toggleBreath()">Start</button>
</div>

<div id="page-grep" class="page">
  <h1>Små grep</h1>
  <p class="support">Enkle ting som kan hjelpe her og nå.</p>
  <div class="actions-list" id="actionsList"></div>
</div>

<div id="page-historikk" class="page">
  <h1>Din oversikt</h1>
  <div class="streak-badge" id="streakBadge">0 dager på rad</div>
  <div class="trend-chart" id="trendChart"></div>
  <div class="trend-labels" id="trendLabels"></div>
  <div id="historyList"></div>
  <div class="summary" id="weekSummary">Du har tatt vare på deg selv 0 ganger denne uken.</div>
</div>

<nav class="nav">
  <button class="active" onclick="switchPage('hjem')"><span>🏠</span>Hjem</button>
  <button onclick="switchPage('pusterom')"><span>🌬️</span>Pusterom</button>
  <button onclick="switchPage('grep')"><span>✋</span>Små grep</button>
  <button onclick="switchPage('historikk')"><span>📖</span>Historikk</button>
</nav>

<script>
const actions = [
  "Gå ut i frisk luft i 5 minutter",
  "Drikk et glass vann sakte",
  "Sett deg og kjenn føttene i gulvet",
  "Skriv ned én ting du er takknemlig for",
  "Ta tre dype pust der du er",
  "Legg telefonen bort i 10 minutter",
  "Strekk armene over hodet"
];

const breathPatterns = {
  rolig: [
    { label: 'Pust inn…', cls: 'inhale', ms: 4000 },
    { label: 'Hold…', cls: 'inhale', ms: 2000 },
    { label: 'Pust ut…', cls: 'exhale', ms: 6000 }
  ],
  box: [
    { label: 'Pust inn…', cls: 'inhale', ms: 4000 },
    { label: 'Hold…', cls: 'inhale', ms: 4000 },
    { label: 'Pust ut…', cls: 'exhale', ms: 4000 },
    { label: 'Hold…', cls: 'exhale', ms: 4000 }
  ],
  dyp: [
    { label: 'Pust inn…', cls: 'inhale', ms: 4000 },
    { label: 'Hold…', cls: 'inhale', ms: 7000 },
    { label: 'Pust ut…', cls: 'exhale', ms: 8000 }
  ]
};
const phaseBg = { inhale: '#e0ebe3', exhale: '#d4e4f0' };

let selectedMood = null;
let breathing = false;
let breathInterval = null;
let currentPattern = 'rolig';
let phase = 0; // index into breathPatterns[currentPattern]

document.querySelectorAll('.pattern-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pattern-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    currentPattern = btn.dataset.pattern;
    phase = 0;
    if (breathing) {
      clearTimeout(breathInterval);
      runBreathCycle();
    }
  });
});

document.querySelectorAll('.mood-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMood = btn.dataset.mood;
  });
});

function saveCheckin() {
  if (!selectedMood) {
    alert('Velg hvordan du har det først.');
    return;
  }
  const note = document.getElementById('note').value.trim();
  const entry = {
    date: new Date().toISOString(),
    mood: selectedMood,
    note: note
  };
  const list = JSON.parse(localStorage.getItem('checkins') || '[]');
  list.unshift(entry);
  localStorage.setItem('checkins', JSON.stringify(list));
  document.getElementById('saveMsg').classList.add('show');
  document.getElementById('note').value = '';
  selectedMood = null;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  setTimeout(() => document.getElementById('saveMsg').classList.remove('show'), 4000);
  renderHistory();
}

function switchPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');
  if (name === 'historikk') renderHistory();
  if (name === 'grep') renderActions();
}

function toggleBreath() {
  const btn = document.getElementById('breathBtn');
  const circle = document.getElementById('breathCircle');
  const text = document.getElementById('breathText');
  if (!breathing) {
    breathing = true;
    btn.textContent = 'Stopp';
    phase = 0;
    runBreathCycle();
  } else {
    breathing = false;
    clearTimeout(breathInterval);
    btn.textContent = 'Start';
    text.textContent = 'Trykk start';
    circle.style.transitionDuration = '';
    circle.className = 'circle';
    document.body.style.transitionDuration = '';
    document.body.style.backgroundColor = '';
  }
}

function runBreathCycle() {
  if (!breathing) return;
  const circle = document.getElementById('breathCircle');
  const text = document.getElementById('breathText');
  const steps = breathPatterns[currentPattern];
  const step = steps[phase];
  circle.style.transitionDuration = step.ms + 'ms';
  document.body.style.transitionDuration = step.ms + 'ms';
  text.textContent = step.label;
  circle.className = 'circle ' + step.cls;
  document.body.style.backgroundColor = phaseBg[step.cls];
  breathInterval = setTimeout(() => {
    phase = (phase + 1) % steps.length;
    runBreathCycle();
  }, step.ms);
}

function renderActions() {
  const done = JSON.parse(localStorage.getItem('doneActions') || '{}');
  const today = new Date().toDateString();
  const list = document.getElementById('actionsList');
  list.innerHTML = '';
  actions.forEach((a, i) => {
    const isDone = done[today] && done[today].includes(i);
    const card = document.createElement('div');
    card.className = 'action-card' + (isDone ? ' done' : '');
    card.innerHTML = `<span>${a}</span><button onclick="toggleAction(${i})">${isDone ? '✓' : 'Gjør'}</button>`;
    list.appendChild(card);
  });
}

function toggleAction(i) {
  const done = JSON.parse(localStorage.getItem('doneActions') || '{}');
  const today = new Date().toDateString();
  if (!done[today]) done[today] = [];
  const idx = done[today].indexOf(i);
  if (idx > -1) done[today].splice(idx, 1);
  else done[today].push(i);
  localStorage.setItem('doneActions', JSON.stringify(done));
  renderActions();
}

function deleteCheckin(i) {
  if (!confirm('Slette denne sjekk-innen?')) return;
  const list = JSON.parse(localStorage.getItem('checkins') || '[]');
  list.splice(i, 1);
  localStorage.setItem('checkins', JSON.stringify(list));
  renderHistory();
}

function renderStreak(list) {
  const days = new Set(list.map(e => new Date(e.date).toDateString()));
  let streak = 0;
  const d = new Date();
  while (days.has(d.toDateString())) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  const badge = document.getElementById('streakBadge');
  badge.textContent = streak === 0
    ? 'Ingen sammenhengende dager ennå. Start i dag 🌱'
    : `${streak} dag${streak === 1 ? '' : 'er'} på rad 🌱`;
}

function renderTrend(list) {
  const chart = document.getElementById('trendChart');
  const labels = document.getElementById('trendLabels');
  chart.innerHTML = '';
  labels.innerHTML = '';
  for (let i = 6; i >= 0; i--) {
    const day = new Date();
    day.setDate(day.getDate() - i);
    const dayKey = day.toDateString();
    const entries = list.filter(e => new Date(e.date).toDateString() === dayKey);
    const bar = document.createElement('div');
    if (entries.length) {
      const avgMood = entries.reduce((s, e) => s + Number(e.mood), 0) / entries.length;
      bar.className = 'trend-bar has-data';
      bar.style.height = Math.max(10, (avgMood / 5) * 100) + '%';
      bar.title = `${avgMood.toFixed(1)} / 5`;
    } else {
      bar.className = 'trend-bar';
      bar.style.height = '6px';
    }
    chart.appendChild(bar);
    const label = document.createElement('span');
    label.textContent = day.toLocaleDateString('no-NO', { weekday: 'narrow' });
    labels.appendChild(label);
  }
}

function renderHistory() {
  const list = JSON.parse(localStorage.getItem('checkins') || '[]');
  const container = document.getElementById('historyList');
  container.innerHTML = '';
  if (list.length === 0) {
    container.innerHTML = '<p class="support">Ingen sjekk-ins ennå. Det er greit.</p>';
  } else {
    list.slice(0, 20).forEach((e, i) => {
      const d = new Date(e.date);
      const moodEmoji = ['', '😔', '😕', '😐', '🙂', '😌'][e.mood] || '😐';
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `<button class="del-btn" onclick="deleteCheckin(${i})" aria-label="Slett sjekk-inn">×</button><div class="date">${d.toLocaleDateString('no-NO', {weekday:'short', day:'numeric', month:'short'})} · ${moodEmoji}</div>${e.note ? '<div>' + e.note + '</div>' : ''}`;
      container.appendChild(item);
    });
  }
  renderStreak(list);
  renderTrend(list);
  // week count
  const now = new Date();
  const weekAgo = new Date(now - 7*24*60*60*1000);
  const weekCount = list.filter(e => new Date(e.date) > weekAgo).length;
  document.getElementById('weekSummary').textContent = `Du har tatt vare på deg selv ${weekCount} ganger denne uken. Det er fint.`;
}

// init
renderActions();
renderHistory();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
