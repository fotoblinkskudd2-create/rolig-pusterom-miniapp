<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lagersimulator</title><link rel="stylesheet" href="/felles/stil.css"><style>input[type=number]{width:70px}.utsolgt{color:var(--feil);font-weight:600}</style></head><body>
<header><h1>Lagerbehov og innkjøpssimulator</h1><span class="demo">Syntetiske data · bare forslag, ingen innkjøpsordre</span></header>
<main><div class="kort rad">
<b>Regelsett A</b><label>Sikkerhetslager ×<input id="a_sf" type="number" step="0.5" value="1"></label><label>Ordresyklus (d)<input id="a_oc" type="number" value="14"></label>
<b>Regelsett B</b><label>Sikkerhetslager ×<input id="b_sf" type="number" step="0.5" value="2"></label><label>Ordresyklus (d)<input id="b_oc" type="number" value="7"></label>
<button id="kjor">Spill av 90 dager</button><button id="forslag" class="sekundaer">Eksporter bestillingsforslag (A)</button></div>
<div class="kort" id="sum"></div><div class="kort wrap"><table id="varer"></table></div><div class="kort" id="detalj"></div></main>
<script type="module">
import { h, $, tom, api } from "/felles/dom.js";
const q = () => new URLSearchParams({ a_sf: $("#a_sf").value, a_oc: $("#a_oc").value, b_sf: $("#b_sf").value, b_oc: $("#b_oc").value, a_navn: "A", b_navn: "B" });
const n = (x, d = 0) => Number(x).toLocaleString("nb-NO", { maximumFractionDigits: d });
async function kjor() {
  const { a, b } = await api("GET", "/api/sammenlign?" + q());
  tom($("#sum"), h("table", { id: "sumtabell" }, h("tr", {}, h("th"), ["Utsolgt-dager", "Tapt antall", "Snitt lagerverdi", "Antall ordre", "Replay-hash"].map(x => h("th", {}, x))),
    [["A", a], ["B", b]].map(([nv, r]) => h("tr", {}, h("td", {}, nv), h("td", { class: "tall" }, r.sum.utsolgt_dager), h("td", { class: "tall" }, r.sum.tapt_antall),
      h("td", { class: "tall" }, n(r.sum.snitt_lagerverdi) + " kr"), h("td", { class: "tall" }, r.sum.antall_ordre), h("td", { class: "svak" }, r.hash.slice(0, 12))))));
  tom($("#varer"), h("tr", {}, ["Vare", "Snitt/dag", "ROP A", "ROP B", "Utsolgt A", "Utsolgt B", "Lagerverdi A", "Lagerverdi B", ""].map(x => h("th", {}, x))),
    a.varer.map((va, i) => { const vb = b.varer[i]; return h("tr", { "data-vare": va.varenr }, h("td", {}, `${va.varenr} ${va.navn}`), h("td", { class: "tall" }, n(va.snitt_per_dag, 2)),
      h("td", { class: "tall" }, va.rop), h("td", { class: "tall" }, vb.rop), h("td", { class: va.utsolgt_dager ? "utsolgt" : "" }, va.utsolgtperioder.map(p => p[0] === p[1] ? p[0] : `${p[0]}–${p[1]}`).join(", ") || "0"),
      h("td", { class: vb.utsolgt_dager ? "utsolgt" : "" }, vb.utsolgtperioder.map(p => p[0] === p[1] ? p[0] : `${p[0]}–${p[1]}`).join(", ") || "0"),
      h("td", { class: "tall" }, n(va.snitt_lagerverdi)), h("td", { class: "tall" }, n(vb.snitt_lagerverdi)),
      h("td", {}, h("button", { class: "sekundaer", onclick: () => detalj(va, vb) }, "Detaljer"))); }));
}
async function detalj(va, vb) {
  const hist = await api("GET", "/api/historikk/" + va.varenr);
  tom($("#detalj"), h("h3", {}, `${va.varenr} ${va.navn}`),
    hist.negative.length ? h("p", { class: "feil", id: "negativ" }, "Negativ historisk beholdning: ", hist.negative.slice(0, 5).map(f => `${f.dato} ${f.lokasjon} ${f.beholdning} (${f.ref})`).join("; ")) : h("p", { class: "ok" }, "Ingen negativ historisk beholdning."),
    h("div", { class: "rutenett" }, [["A", va], ["B", vb]].map(([nv, v]) => h("div", {}, h("b", {}, `Replay ${nv} (ROP ${v.rop}, bestill opp til ${v.bestill_opp_til})`), h("pre", {}, v.logg.join("\n"))))));
}
$("#kjor").onclick = kjor; $("#forslag").onclick = () => location.href = "/api/forslag.csv?" + q();
kjor();
</script></body></html>
