<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF-bestilling</title><link rel="stylesheet" href="/felles/stil.css">
<style>main{max-width:1500px}.to{display:grid;grid-template-columns:minmax(300px,1fr) minmax(420px,1.2fr);gap:12px}@media(max-width:900px){.to{grid-template-columns:1fr}}
.side{position:relative;margin-bottom:10px;border:1px solid var(--linje)}.side img{width:100%;display:block}.bb{position:absolute;border:2px solid rgba(31,95,139,.7);background:rgba(31,95,139,.08)}.bb.aktiv{border-color:#e00;background:rgba(255,0,0,.15)}
td input{width:100%;min-width:60px}td:nth-child(2) input{min-width:220px}tr.bekreftet{background:rgba(46,125,50,.08)}tr.avvist{opacity:.5;text-decoration:line-through}.rettet{outline:2px solid var(--adv)}</style></head><body>
<header><h1>Bestillingsgrunnlag fra PDF</h1><span class="demo">Lokal · uttrekk er forslag til du bekrefter · ingen bestilling sendes</span></header>
<main><div class="kort rad"><label>Dokument<select id="dok"></select></label><span id="sidestatus"></span><button id="ocr" class="sekundaer">Kjør OCR</button>
<button id="nullstill" class="sekundaer">Nullstill</button><a id="ejson" href="#">Eksporter JSON</a><a id="ecsv" href="#">Eksporter CSV</a></div>
<div id="kontroller" class="kort"></div><div class="to"><div id="sider"></div><div class="kort wrap"><table id="linjer"></table>
<p class="svak">Bare <b>bekreftede</b> linjer eksporteres. Rettelser markeres og krever ny bekreftelse. OCR-felt er alltid usikre.</p></div></div></main>
<script type="module">
import { h, $, tom, api } from "/felles/dom.js";
let fil = null, D = null, aktiv = null;
const FELT = ["produkt", "antall", "enhet", "pris"];
async function velg(f) { fil = f; D = await api("GET", `/api/dok/${f}`); tegn(); }
async function post(sti, kropp) { try { D = await api("POST", `/api/dok/${fil}/${sti}`, kropp); } catch (e) { alert(e.message); } tegn(); }
function tegn() {
  $("#ejson").href = `/api/dok/${fil}/eksport.json`; $("#ecsv").href = `/api/dok/${fil}/eksport.csv`;
  tom($("#sidestatus"), D.sider.map(s => h("span", { class: "merke " + (s.type === "skannet" ? "adv" : "ok"), "data-ocr": s.side }, `s${s.side}: ${s.type} · ${s.ocr_status}`)));
  $("#ocr").disabled = !D.sider.some(s => s.type === "skannet");
  tom($("#kontroller"), D.kontroller.map(k => h("div", { class: k.type === "sum stemmer" ? "ok" : "adv" }, `${k.type}: ${k.tekst}`)),
    D.sider.flatMap(s => s.feil).map(f => h("div", { class: "feil" }, f)));
  tom($("#sider"), D.sider.map(s => { const boks = h("div", { class: "side" }, h("img", { src: `/api/side/${fil}/${s.side}`, alt: "side " + s.side }));
    for (const l of D.linjer) for (const k of FELT) { const f = l.felter[k]; if (f.side === s.side && f.bbox) boks.append(h("div", { class: "bb" + (aktiv === `${l.id}.${k}` ? " aktiv" : ""), title: `${l.id} ${k}`,
      style: `left:${f.bbox[0] / s.bredde * 100}%;top:${f.bbox[1] / s.hoyde * 100}%;width:${(f.bbox[2] - f.bbox[0]) / s.bredde * 100}%;height:${(f.bbox[3] - f.bbox[1]) / s.hoyde * 100}%` })); }
    return boks; }));
  tom($("#linjer"), h("tr", {}, ["", ...FELT, "Kilde", "Status", ""].map(x => h("th", {}, x))),
    D.linjer.map(l => h("tr", { class: l.status, "data-linje": l.id }, h("td", {}, l.id),
      FELT.map(k => { const f = l.felter[k]; return h("td", {}, h("input", { value: f.verdi ?? "", class: f.rettet ? "rettet" : "", title: `side ${f.side} · rå: «${f.raa}»${f.konfidens != null && l.kilde === "ocr" ? " · OCR-konfidens " + f.konfidens : ""}`, "data-felt": `${l.id}.${k}`,
        onfocus: () => { aktiv = `${l.id}.${k}`; document.querySelectorAll(".bb").forEach(b => b.classList.toggle("aktiv", b.title === `${l.id} ${k}`)); },
        onchange: e => post("rett", { linje: l.id, felt: k, verdi: e.target.value }) })); }),
      h("td", { class: l.kilde === "ocr" ? "adv" : "" }, l.kilde), h("td", {}, l.status, l.merknader.length > 0 && h("div", { class: "adv", style: "font-size:12px" }, l.merknader.join("; "))),
      h("td", {}, h("button", { "data-bekreft": l.id, disabled: l.status === "bekreftet", onclick: () => post("status", { linje: l.id, status: "bekreftet" }) }, "Bekreft"),
        h("button", { class: "sekundaer", onclick: () => post("status", { linje: l.id, status: l.status === "avvist" ? "uttrukket" : "avvist" }) }, l.status === "avvist" ? "Angre" : "Avvis")))));
}
const liste = await api("GET", "/api/dokumenter");
liste.forEach(f => $("#dok").append(h("option", { value: f }, f)));
$("#dok").onchange = e => velg(e.target.value);
$("#ocr").onclick = () => post("ocr");
$("#nullstill").onclick = () => post("nullstill");
velg(liste[0]);
</script></body></html>
