<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stafett simulator</title>
<style>
  body { margin: 0; background: #2a2a27; color: #e7e5de; font: 15px/1.4 system-ui, sans-serif; }
  .flate { display: flex; flex-wrap: wrap; gap: 32px; padding: 24px; justify-content: center; align-items: flex-start; }
  .enhet { background: #3b3b37; padding: 22px 22px 18px; border-radius: 18px; box-shadow: 0 30px 60px rgba(0,0,0,.45); }
  canvas { display: block; width: 400px; height: 300px; image-rendering: pixelated; border: 6px solid #111; border-radius: 4px; }
  .hjul { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button { background: #e7e5de; color: #1e1e1c; border: 0; border-radius: 10px; padding: 9px 12px; font: inherit; font-weight: 700; cursor: pointer; }
  button.ghost { background: transparent; color: #e7e5de; border: 1px solid #77756d; }
  .tid { margin-top: 12px; font-size: 13px; color: #b8b6ad; }
  iframe { width: 390px; height: 760px; border: 10px solid #111; border-radius: 36px; background: #e7e5de; }
  h1 { font-size: 13px; letter-spacing: .1em; margin: 0 0 12px; color: #b8b6ad; }
</style>
</head>
<body>
<div class="flate">
  <div class="enhet">
    <h1>STAFETT · E-BLEKK 400×300 (samme kode som enheten)</h1>
    <canvas id="skjerm" width="400" height="300"></canvas>
    <div class="hjul">
      <button id="vri-" type="button" aria-label="Vri mot venstre">⟲ vri</button>
      <button id="trykk" type="button">● trykk</button>
      <button id="vri+" type="button" aria-label="Vri mot høyre">vri ⟳</button>
      <button id="hold3" class="ghost" type="button">hold 3 s</button>
      <button id="hold10" class="ghost" type="button">hold 10 s</button>
    </div>
    <div class="hjul">
      <button class="ghost" data-hopp="3600000" type="button">+1 t</button>
      <button class="ghost" data-hopp="43200000" type="button">+12 t</button>
      <button class="ghost" data-hopp="172800000" type="button">+48 t</button>
    </div>
    <div class="tid" id="tid"></div>
  </div>
  <iframe id="telefon" title="Telefon"></iframe>
</div>
<script>
const PAPIR = [231, 229, 222], BLEKK = [30, 30, 28];
const K = new URLSearchParams(location.hash.slice(1)).get('k') || '';
const H = { 'X-Stafett-Nokkel': K, 'Content-Type': 'application/json' };
document.getElementById('telefon').src = '/' + (K ? '#k=' + encodeURIComponent(K) : '');
const ctx = document.getElementById('skjerm').getContext('2d');
async function tegn() {
  const r = await fetch('/skjerm.pbm', { headers: H });
  const b = new Uint8Array(await r.arrayBuffer());
  // P4\n400 300\n
  let i = 0, nl = 0;
  while (nl < 2) if (b[i++] === 10) nl++;
  const img = ctx.createImageData(400, 300);
  for (let p = 0; p < 400 * 300; p++) {
    const sort = b[i + (p >> 3)] & (0x80 >> (p & 7));
    const c = sort ? BLEKK : PAPIR;
    img.data.set([c[0], c[1], c[2], 255], p * 4);
  }
  ctx.putImageData(img, 0, 0);
  const s = await (await fetch('/api/state', { headers: H })).json();
  document.getElementById('tid').textContent = 'Enhetens klokke: ' + new Date(s.naa).toLocaleString('no-NO');
}
const hjul = (h) => fetch('/api/hjul', { method: 'POST', headers: H, body: JSON.stringify({ h }) }).then(tegn);
for (const id of ['vri-', 'trykk', 'vri+', 'hold3', 'hold10']) document.getElementById(id).onclick = () => hjul(id);
document.querySelectorAll('[data-hopp]').forEach((b) => b.onclick = async () => {
  await fetch('/sim/hopp', { method: 'POST', headers: H, body: JSON.stringify({ ms: +b.dataset.hopp }) });
  tegn();
  document.getElementById('telefon').contentWindow.location.reload();
  // telefonen beholder nøkkelen i localStorage
});
tegn();
setInterval(tegn, 2000);
</script>
</body>
</html>
