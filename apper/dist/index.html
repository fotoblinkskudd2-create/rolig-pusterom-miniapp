nterest, mint green (#34C759) for paid-off progress. SF Pro Rounded numerals, huge. Screen 1 «Oversikt»: hero card with a live interest taximeter ticking kroner per second like an odometer, beneath it per-day / per-year cost, then an inset grouped list of debts with balance + APR. Screen 2 «Plan»: segmented control Snøball | Skred, debt-free date as a giant headline, month-by-month payoff order as a vertical timeline. Screen 3 «Gjeld»: detail with balance, rate, minimum payment, monthly fee, payment log. Native large-title nav, bottom tab bar, 393×852, light + dark. Microcopy in Norwegian, direct: «Dette koster deg 41 kr i døgnet». No money bags, no 3D coins, no stock illustration.","iconPrompt":"iOS app icon, a single sledgehammer cracking a red percent sign, flat vector, deep red gradient, white glyph, no text"},{"id":"delene","name":"Delene","tagline":"Systemlogg for flere i ett hode.","category":"Hode","emoji":"🧩","colors":["#c86bff","#5856d6"],"tint":"#af52de","problem":"Folk med DID/OSDD mister tid, minner og sammenheng mellom deler. Notatene ligger spredt, det finnes ingen felles oppslagstavle, og nesten alle apper er bygget for én «deg».","signal":"Brukere av mental helse-apper forventer mer nyanse enn en skala fra 1 til 5 (AppOpportunity 2026). Ingen lokal-først-aktør dominerer verktøy for flersystemer, og sensitive data krever at ingenting forlater enheten.","audience":"Personer med dissosiative lidelser, deres behandlere og andre som lever som flersystem.","model":"Gratis, med donasjon. Data forlater aldri enheten.","features":["Front-logg: hvem er fremme, co-front, tidsstempel","Deleregister med rolle, alder, farge, trøst og triggere","Felles oppslagstavle mellom deler","«Tapt tid»-logg: hva skjedde, hva ble kjøpt","Eksport for behandler"],"gonzo":"En del tok over klokka 14 og kjøpte Lego. Nå står det i loggen med navn. Ingen flere spøkelser i bankappen.","prompt":"Design an iOS 18 app «Delene», a private system journal for people with DID/OSDD (plural systems). Feeling: safe, warm, non-clinical, like a shared house notebook. Palette: soft violet (#AF52DE) to indigo (#5856D6) accents on neutral system backgrounds; every alter/part has its own colour dot. Screen 1 «Fremme»: big card showing who is fronting now (colour avatar circles, co-front allowed), a timestamp «siden 14:02», and a horizontal timeline strip of today's switches. Screen 2 «Deler»: grid of part cards (name, age, role, pronouns, colour), tap opens profile with «Trøst» and «Triggere» sections. Screen 3 «Tavla»: message board where parts leave notes for each other, signed with their colour. Screen 4 «Tapt tid»: log of lost time with «hva vet vi» and «hva ble kjøpt». Rounded cards, generous spacing, large title nav, tab bar. Microcopy in Norwegian, gentle: «Alle er velkomne her». No brains, no puzzle-piece cliché in the UI, no medical blue.","iconPrompt":"iOS app icon, overlapping translucent circles in violet, indigo and pink forming a soft cluster, flat, no text"},{"id":"impulsbrems","name":"Impulsbrems","tagline":"Kjølerom for kjøp.","category":"Penger","emoji":"🧊","colors":["#64d2ff","#0a5cff"],"tint":"#0a84ff","problem":"Klarna har gjort «kjøp nå» til ett trykk, og ingen motvekt er like rask. Prisen i kroner føles abstrakt. Prisen i arbeidstimer gjør ikke det.","signal":"Personvern-først-verktøy er grønt lys for indier (dev.to 2026). BNPL vokser. Ingen norsk app regner prisen om til arbeidstimer etter skatt.","audience":"Impulskjøpere, folk med ADHD og alle som har fått en pakke de ikke husker å ha bestilt.","model":"Gratis med engangsopplåsing på 29 kr for ubegrensede ønsker.","features":["Legg inn ønsket ting, så kjøles den i 24 timer, 72 timer eller én uke","Prisen omregnet til arbeidstimer etter skatt","Når tiden er ute, velger du kjøp eller dropp","Teller for spart beløp"],"gonzo":"Robotstøvsugeren koster 31 arbeidstimer. Den kan vente tre døgn i fryseren. Det kan ikke jeg, men nå må jeg.","prompt":"Design an iOS 18 app «Impulsbrems», a cooling-off chamber for impulse purchases. Visual metaphor: items frozen in ice blocks that slowly thaw. Palette: glacier cyan (#64D2FF) to deep blue (#0A5CFF), frosted glass materials, white space. Screen 1 «Fryseren»: list of frozen wishes, each card shows product name, price, a thaw progress ring and remaining time «2 d 4 t», plus price translated to work hours «= 31 arbeidstimer». Screen 2 add sheet: name, price, link, cooling period segmented 24 t | 72 t | 1 uke. Screen 3 «Tint»: when thawed, a decision card with two big buttons «Kjøp» and «Dropp»; dropping adds to a «Spart» counter shown as a giant rounded number. Settings: hourly wage + tax %. Frosted cards with subtle ice texture, large titles, tab bar. Norwegian microcopy. No shopping carts, no confetti.","iconPrompt":"iOS app icon, a shopping tag frozen inside a glossy ice cube, cyan to blue gradient, flat vector, no text"},{"id":"skiftsovn","name":"Skiftsøvn","tagline":"Søvnplan for turnus, ikke for 9–17.","category":"Kropp","emoji":"🌗","colors":["#7d7aff","#1c1b4a"],"tint":"#5e5ce6","problem":"Sykepleiere, vektere, offshorearbeidere og bussjåfører får søvnråd skrevet for folk som jobber 9–17. Ingen app sier når du skal sove, slutte med kaffe eller unngå lys før og etter en nattevakt.","signal":"AppOpportunity 2026 nevner meditasjon for skiftarbeidere som eksempel på spesifisitet som vinner, og generelle søvnapper er mettet.","audience":"Turnusarbeidere i helse, industri, transport og vakt.","model":"Engangskjøp 59 kr.","features":["Legg inn vakter som dag, kveld, natt eller fri","Beregnet søvnvindu, kaffestopp og lysvindu per døgn","Ukeoversikt","Sjekkliste før nattevakt"],"gonzo":"Klokka er 07:40, jeg har nettopp kommet hjem fra natt, sola skjærer meg i øynene, og verden vil at jeg skal spise frokost.","prompt":"Design an iOS 18 app «Skiftsøvn», a sleep planner for shift workers. Mood: night-time calm, nurse-at-4am tired-friendly. Dark-first: midnight navy (#1C1B4A) to indigo (#5E5CE6), warm amber (#FF9F0A) for daylight windows, muted grey for sleep. Screen 1 «I dag»: a 24-hour circular clock dial showing today's shift arc, the sleep window arc, a caffeine cutoff tick and a «lys/mørke» band, with the next action as a headline «Sov 08:30–15:30». Screen 2 «Uke»: 7 rows, each with a horizontal 24 h bar showing shift (coloured by type) and sleep block. Screen 3 add shift sheet: type chips Dag | Kveld | Natt | Fri, start and end time wheels. Big tap targets, low-contrast-at-night palette, SF Pro Rounded times, tab bar. Norwegian microcopy. No moons with faces, no stars clip-art.","iconPrompt":"iOS app icon, a circle split diagonally into sun-amber and night-indigo halves with a thin clock hand, flat, no text"},{"id":"tinnitusro","name":"Tinnitusro","tagline":"Finn pipet ditt. Mask det.","category":"Kropp","emoji":"🎧","colors":["#40c8e0","#0b3d4a"],"tint":"#30b0c7","problem":"Hvitstøy-apper spiller generisk regnvær. Ingen hjelper deg å finne tinnitusfrekvensen din, eller å lage støy med et hakk (notch) akkurat der det piper.","signal":"AppOpportunity 2026 bruker meditasjon for folk med tinnitus som eksempel på nisjer som selger. Web Audio API gjør dette mulig uten server.","audience":"Folk med tinnitus og alle som sover dårlig av piping.","model":"Engangskjøp 49 kr.","features":["Frekvensmatcher med tonegenerator","Hvit, rosa og brun støy","Hakkfilter sentrert på din frekvens","Sovetimer som tones ut"],"gonzo":"Det piper på 6 kHz. Det har pipet i fire år. Nå piper jeg tilbake med brun støy og et hull akkurat der det gjør vondt.","prompt":"Design an iOS 18 app «Tinnitusro», a tinnitus frequency matcher and sound masker. Mood: deep-sea quiet. Palette: abyss teal (#0B3D4A) to sea cyan (#30B0C7), soft white waveform lines. Screen 1 «Mask»: large play/pause disc in the centre with a slowly breathing ring, below it noise colour chips Hvit | Rosa | Brun, a volume slider and a sleep timer row «Slå av etter 30 min». Screen 2 «Finn frekvens»: a horizontal frequency slider (250 Hz–12 kH row with an initial avatar, name, «Sist: 47 dager siden», an overdue bar, and quick actions «Ringte», «Melding», «Møttes». Screen 2 person detail: desired frequency (Ukentlig, Månedlig, Kvartalsvis), contact history timeline, «Snakk om neste gang» notes. Screen 3 «Alle». Rounded avatars with generated pastel colours, large titles, tab bar. Norwegian microcopy. No social feed patterns, no likes.","iconPrompt":"iOS app icon, a classic phone handset forming a loop with a small heart, green to teal gradient, flat, no text"},{"id":"snekkerkalk","name":"Snekkerkalk","tagline":"Kappliste og trapp, uten svinn.","category":"Verktøy","emoji":"🪚","colors":["#c9a46b","#5c4326"],"tint":"#a2742f","problem":"Du står på Byggmax og skal kjøpe nok 48×98. Hvor mange 4,8-meters lengder trenger du til 23 kapp, når sagsnittet tar 3 mm hver gang?","signal":"Spesialistverktøy fungerer fortsatt der enkle verktøy dør, med snekkerkalkulator som eksempel (AppOpportunity 2026).","audience":"Hobbysnekkere, håndverkere og folk som pusser opp.","model":"Engangskjøp 49 kr.","features":["Kappliste-optimalisering (first-fit decreasing) med sagsnitt","Visuell kappeplan per lengde","Trappekalkulator for opptrinn, inntrinn og stigning","Svinnprosent"],"gonzo":"Jeg kjøpte ti lengder. Jeg trengte sju. Tre plank ligger i garasjen som et monument over hoderegning.","prompt":"Design an iOS 18 app «Snekkerkalk», a woodworking calculator: cut-list optimiser and stair calculator. Mood: workshop, pencil on timber, tape-measure yellow. Palette: pine (#C9A46B), walnut (#5C4326), tape yellow (#FFD60A) accent, graph-paper backgrounds. Screen 1 «Kappliste»: inputs for stock length (mm) and kerf, a list of cuts (length × quantity) with add row, result: «7 lengder · 4,2 % svinn» and a visual plan, one horizontal bar per stock board, divided into coloured segments for each cut, grey hatched waste at the end. Screen 2 «Trapp»: total rise and run inputs, output number of steps, riser height, tread depth, comfort rule check (2 × opptrinn + inntrinn ≈ 62 cm) with a green/red badge and a side-profile stair diagram. Bold mono numerals, large titles, tab bar. Norwegian microcopy.","iconPrompt":"iOS app icon, a hand saw crossing a pine plank with a measuring tick scale, wood brown gradient, flat, no text"},{"id":"boligkalk","name":"Boligkalk","tagline":"Boliglån, norske regler.","category":"Penger","emoji":"🏠","colors":["#3d9bff","#30b0c7"],"tint":"#0a84ff","problem":"Amerikanske lånekalkulatorer kjenner ikke utlånsforskriften, dokumentavgiften eller forskjellen på serielån og annuitetslån. Bankenes kalkulatorer vil ha e-posten din.","signal":"Finansverktøy tilpasset lokale markeder vokser, og eiendomskalkulatorer nevnes som spesialistverktøy som fortsatt fungerer (AppOpportunity 2026).","audience":"Førstegangskjøpere og folk som refinansierer.","model":"Gratis, uten innsamling av data.","features":["Annuitet mot serielån: månedsbeløp og totalrente","Sjekk mot utlånsforskriften: egenkapital, fem ganger inntekt og stresstest","Dokumentavgift og total kjøpesum","Alle satser kan endres"],"gonzo":"Banken sier ja til 3,4 millioner. Stresstesten sier at jeg spiser knekkebrød til 2051. Kalkulatoren sier det samme, men uten å ville ha e-posten min.","prompt":"Design an iOS 18 app «Boligkalk», a Norwegian mortgage calculator that knows local lending rules. Mood: trustworthy, bank-grade clarity without bank branding. Palette: clear blue (#0A84FF) to teal (#30B0C7), white, green/red status badges. Screen 1 «Lån»: inputs (kjøpesum, egenkapital, rente, løpetid) in an inset grouped list, segmented Annuitet | Serie, results card: monthly payment first month, total interest, a stacked area chart of interest vs principal over time. Screen 2 «Krav»: checklist with status badges: Egenkapital ≥ 10 %, Gjeld ≤ 5 × inntekt, Stresstest (+3 pp) betjenbar, each with the exact numbers. Screen 3 «Kjøp»: dokumentavgift 2,5 %, tinglysing, total cash needed. Large titles, tab bar, tabular figures. Norwegian microcopy. e93","#3a3a3c"],"tint":"#636366","problem":"Store valg kverner i hodet i flere uker: flytte, slutte, kjøpe. Fordel- og ulempelister vekter ikke noe, og magefølelsen får aldri ordet.","signal":"Beslutningsverktøy står på listen over personvern-først-verktøy der indier vinner (dev.to 2026).","audience":"Overtenkere.","model":"Engangskjøp 29 kr.","features":["Vektet beslutningsmatrise med kriterier og alternativer","Myntkast for magefølelsen: hva håpet du på?","Lagrede beslutninger","Oppfølging av utfallet senere"],"gonzo":"Matrisen sa Bergen 7,4 mot Oslo 7,1. Så kastet jeg mynt og fikk Oslo, og kjente at jeg ble skuffet. Da visste jeg det.","prompt":"Design an iOS 18 app «Besluttet», a decision helper with a weighted matrix and a coin-flip gut check. Mood: stoic, grey-scale calm, one colour only for the winner. Palette: graphite (#3A3A3C), system greys, winner highlight in green (#34C759). Screen 1 «Matrise»: options as columns, criteria as rows with weight steppers (1–5), cells are 1–10 score chips, a totals row with the winner column glowing. Screen 2 «Mynt»: a large 3D-ish coin that flips with a tap, lands on one option, then asks «Ble du lettet eller skuffet?» with two buttons, and records the gut answer. Screen 3 «Beslutninger»: saved decisions with the date and «Hvordan gikk det?» follow-up. Monochrome, crisp, large titles, tab bar. Norwegian microcopy.","iconPrompt":"iOS app icon, a minimal balance scale with one pan slightly lower, graphite gradient, silver glyph, flat, no text"},{"id":"sekkevekt","name":"Sekkevekt","tagline":"Hvert gram teller på fjellet.","category":"Kropp","emoji":"🎒","colors":["#34c759","#8a6a3f"],"tint":"#3a9d4f","problem":"Ultralette turgåere holder utstyret i Excel. Spørsmålet før turen er alltid det samme: hva veier sekken, og hva er det tyngste jeg kan bytte ut?","signal":"Spesialiserte friluftsapper gjør det godt mens generelle apper er mettet (AppOpportunity 2026). Norsk turkultur og DNT-hytter gir et eget hjemmemarked.","audience":
