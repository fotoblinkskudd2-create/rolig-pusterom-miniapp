# Bygger verksted/ og publiserer til GitHub Pages ved push til main.
# Krever: Settings → Pages → Source: «GitHub Actions».
name: Verksted → Pages
on:
  push:
    branches: [main]
    paths: ['verksted/**', '.github/workflows/verksted-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    defaults: { run: { working-directory: verksted } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: verksted/package-lock.json }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: verksted/dist }
      - id: d
        uses: actions/deploy-pages@v4
