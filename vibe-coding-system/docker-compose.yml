# Lokal sandkasse:  docker compose up
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: dev-only
      POSTGRES_DB: vibe
    ports: ["5432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      VIBE_ENV: dev
      DATABASE_URL: postgresql://postgres:dev-only@db:5432/vibe
    ports: ["8000:8000"]
    depends_on: [db]
