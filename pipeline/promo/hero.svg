<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Fem rolige symboler rundt en pustende sol: nettbrett med smil, bølgelinje, to sammenkoblede sirkler, hender og en mynt">
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fb3ab"/><stop offset=".7" stop-color="#5f9a92"/><stop offset="1" stop-color="#4a857e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f2b29f" stop-opacity=".55"/><stop offset="1" stop-color="#f2b29f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f3e8"/><stop offset="1" stop-color="#f1e8d6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2f5a55" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1130" cy="450" r="420" fill="url(#glow)"/>
  <g fill="none" stroke="#5f9a92" stroke-opacity=".18" stroke-width="2">
    <circle cx="1130" cy="450" r="250"/><circle cx="1130" cy="450" r="320"/><circle cx="1130" cy="450" r="395"/>
  </g>
  <circle cx="1130" cy="450" r="170" fill="url(#sun)"/>
  <path d="M1010 455 C1050 405 1080 505 1130 455 S1210 405 1250 455" fill="none" stroke="#f8f3e8" stroke-width="10" stroke-linecap="round"/>

  <!-- Aldersomsorg: nettbrett med smil -->
  <g transform="translate(860 150)" filter="url(#soft)">
    <rect width="150" height="150" rx="38" fill="#fffaf0"/>
    <rect x="38" y="30" width="74" height="92" rx="12" fill="none" stroke="#3f7f7a" stroke-width="7"/>
    <circle cx="62" cy="66" r="5" fill="#3f7f7a"/><circle cx="88" cy="66" r="5" fill="#3f7f7a"/>
    <path d="M60 88 Q75 102 90 88" fill="none" stroke="#e0806a" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Bipolar: stemningsbølge -->
  <g transform="translate(1320 120)" filter="url(#soft)">
    <rect width="150" height="150" rx="38" fill="#fffaf0"/>
    <path d="M28 78 C48 30 62 30 75 75 S102 122 122 72" fill="none" stroke="#3f7f7a" stroke-width="8" stroke-linecap="round"/>
    <circle cx="122" cy="72" r="8" fill="#e0806a"/>
  </g>
  <!-- Ensomhet: to sirkler som møtes -->
  <g transform="translate(1390 390)" filter="url(#soft)">
    <rect width="150" height="150" rx="38" fill="#fffaf0"/>
    <circle cx="58" cy="75" r="28" fill="#3f7f7a" fill-opacity=".85"/>
    <circle cx="92" cy="75" r="28" fill="#e0806a" fill-opacity=".85"/>
  </g>
  <!-- Smerte og sorg: hender -->
  <g transform="translate(1290 650)" filter="url(#soft)">
    <rect width="150" height="150" rx="38" fill="#fffaf0"/>
    <path d="M30 95 Q50 60 78 70 L100 78" fill="none" stroke="#3f7f7a" stroke-width="12" stroke-linecap="round"/>
    <path d="M120 60 Q100 98 72 88 L50 80" fill="none" stroke="#e0806a" stroke-width="12" stroke-linecap="round"/>
  </g>
  <!-- Økonomi: mynt -->
  <g transform="translate(850 640)" filter="url(#soft)">
    <rect width="150" height="150" rx="38" fill="#fffaf0"/>
    <ellipse cx="75" cy="92" rx="38" ry="14" fill="#e0806a" fill-opacity=".35"/>
    <circle cx="75" cy="70" r="34" fill="none" stroke="#3f7f7a" stroke-width="8"/>
    <path d="M75 52 V88 M64 60 H82 Q90 60 90 68 Q90 76 82 76 H66" fill="none" stroke="#3f7f7a" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g fill="#e0806a" fill-opacity=".5"><circle cx="1240" cy="260" r="6"/><circle cx="1030" cy="660" r="5"/><circle cx="1500" cy="320" r="4"/><circle cx="980" cy="330" r="4"/></g>
</svg>
